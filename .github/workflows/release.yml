name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  test:
    uses: ./.github/workflows/test.yml
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/pusztaia/stack-ui
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # not for a prerelease (v1.0.0-rc1): only its own version tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  notes:
    # The GitHub release, with this version's section of CHANGELOG.md as its text. After the image: a build that
    # fails publishes nothing. (The tests, run first, already fail when the changelog has no section for the version.)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/release-notes.py "$TAG" CHANGELOG.md notes.md
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # a prerelease (v1.0.0-rc1) is not marked latest
          if [[ "$TAG" == *-* ]]; then kind=(--prerelease --latest=false); else kind=(--latest); fi
          if gh release view "$TAG" > /dev/null 2>&1; then     # a re-run: the text is brought up to date
            gh release edit "$TAG" --title "Stack UI ${TAG#v}" --notes-file notes.md "${kind[@]}"
          else
            gh release create "$TAG" --verify-tag --title "Stack UI ${TAG#v}" --notes-file notes.md "${kind[@]}"
          fi
