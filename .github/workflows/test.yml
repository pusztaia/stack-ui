name: test
on:
  push: {}
  pull_request: {}
  workflow_call: {}
jobs:
  test:
    # not ubuntu-latest: on Ubuntu 26.04 setup-python has no Python 3.9 (this project supports it)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pyyaml==6.0.3
      - run: python -m unittest discover -s tests -v
      - run: python -c "import yaml; yaml.safe_load(open('compose.example.yaml'))"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: page script syntax
        run: |
          python - <<'EOF'
          import re, pathlib
          html = pathlib.Path('stack_ui/page.html').read_text(encoding='utf-8')
          js = re.search(r'<script>(.*)</script>', html, re.S).group(1)
          js = js.replace("'__UI_TOKEN__'", "''").replace('__AUTH__', 'false').replace("'__SOURCE__'", "''")
          pathlib.Path('page.js').write_text(js, encoding='utf-8')
          EOF
          node --check page.js
  image:
    # The image is built (not pushed) for every push and pull request, so a change that breaks its build (a base
    # image without wheels for a pinned package, a package that is gone) shows here, not at the next release.
    # A tag builds it for real in release.yml.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: build for both platforms
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      - name: load the amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: stack-ui:ci
      - name: the image starts (tini, python, the imports)
        run: docker run --rm stack-ui:ci --help
