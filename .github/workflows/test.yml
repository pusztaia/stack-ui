name: test
on:
  push: {}
  pull_request: {}
  workflow_call: {}
jobs:
  test:
    # Python 3.14 only: the image's version is the one supported (CLAUDE.md)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install pyyaml==6.0.3
      # before the tests: tests/test_page_logic.py runs the page's logic in Node (skipped without it)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - run: python -m unittest discover -s tests -v
      - run: python -c "import yaml; yaml.safe_load(open('compose.example.yaml'))"
      - name: page script syntax
        run: |
          python - <<'EOF'
          import re, pathlib
          html = pathlib.Path('stack_ui/page.html').read_text(encoding='utf-8')
          js = re.search(r'<script>(.*)</script>', html, re.S).group(1)
          js = js.replace("'__UI_TOKEN__'", "''").replace('__AUTH__', 'false').replace("'__SOURCE__'", "''")
          pathlib.Path('page.js').write_text(js, encoding='utf-8')
          EOF
          node --check page.js
  image:
    # The image is built (not pushed) for every push and pull request, so a change that breaks its build (a base
    # image without wheels for a pinned package, a package that is gone) shows here, not at the next release.
    # A tag builds it for real in release.yml.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build for both platforms
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      - name: load the amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: stack-ui:ci
      - name: the image starts (tini, python, the imports)
        run: docker run --rm stack-ui:ci --help
