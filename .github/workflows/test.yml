name: test
on:
  push: {}
  pull_request: {}
  workflow_call: {}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pyyaml==6.0.2
      - run: python -m unittest discover -s tests -v
      - run: python -c "import yaml; yaml.safe_load(open('compose.example.yaml'))"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: page script syntax
        run: |
          python - <<'EOF'
          import re, pathlib
          html = pathlib.Path('stack_ui/page.html').read_text(encoding='utf-8')
          js = re.search(r'<script>(.*)</script>', html, re.S).group(1)
          js = js.replace("'__UI_TOKEN__'", "''").replace('__AUTH__', 'false').replace("'__SOURCE__'", "''")
          pathlib.Path('page.js').write_text(js, encoding='utf-8')
          EOF
          node --check page.js
