# Stack UI - copy this file, set STACKS_DIR (and STACK_UI_ALLOWED_HOSTS), then:
#   sudo podman-compose -f compose.example.yaml up -d      (rootful; rootless: without sudo, see the socket below)
# The page's password: its hash is a Podman secret (see README, Install, step 2).
services:
  stack-ui:
    image: ghcr.io/pusztaia/stack-ui:1
    container_name: stack-ui
    restart: always
    ports:
      # loopback only; to open it on the LAN use your host's address (e.g. 192.168.1.10:8770:8770),
      # better behind a reverse proxy with HTTPS
      - "127.0.0.1:${STACK_UI_PORT:-8770}:8770/tcp"
    environment:
      STACKS_DIR: ${STACKS_DIR:?set STACKS_DIR to your stacks folder}
      # the host names / addresses the page is opened as (comma separated)
      STACK_UI_ALLOWED_HOSTS: ${STACK_UI_ALLOWED_HOSTS:-127.0.0.1,localhost}
      STACK_UI_SELF: stack-ui
      # behind a reverse proxy: its address / network, so the login throttle counts each client (README, Configuration)
      # STACK_UI_TRUSTED_PROXIES: 172.18.0.0/16
      TZ: ${TZ:-UTC}
    volumes:
      # the stacks, at the same path as on the host: podman-compose resolves ./paths there
      - ${STACKS_DIR}:${STACKS_DIR}
      - stack-ui-data:/data
      # rootful Podman (sudo systemctl enable --now podman.socket):
      - /run/podman/podman.sock:/run/podman/podman.sock
      # rootless Podman instead (systemctl --user enable --now podman.socket; your UID from `id -u`):
      # - /run/user/1000/podman/podman.sock:/run/podman/podman.sock
    secrets:
      - stack-ui-password
    security_opt:
      - no-new-privileges:true
    # Hardening, tested with rootful Podman 5.7 (sign-in, upload, create, update, start, stop, delete, files owned
    # like their folder; rootless not tried). The three capabilities let the page write into stack folders of
    # other owners and give new files their folder's owner; everything else is dropped. The tmpfs on /run/secrets
    # is needed: with a read-only root file system the Podman secret cannot be mounted without it. If something
    # fails with "permission denied", comment these lines out to see whether they are the cause.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp
      - /run/secrets
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 256
    logging:
      driver: k8s-file
      options:
        max-size: 5m

volumes:
  stack-ui-data:

secrets:
  stack-ui-password:
    external: true
