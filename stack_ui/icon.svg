<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- stack-ui: three stacked layers on a dark tile (favicon, sidebar logo, sign-in page) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2547"/>
      <stop offset="1" stop-color="#17131f"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#b9a4fb"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b08cfb"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="low" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8155ef"/>
      <stop offset="1" stop-color="#6025d0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1.5"/>
  <g transform="translate(32 32) scale(1.14) translate(-32 -33)" stroke="#1b1726" stroke-width="1.5" stroke-linejoin="round">
    <path d="M10 41v4l22 11 22-11v-4L32 52Z" fill="#3b1580"/>
    <path d="M32 30 54 41 32 52 10 41Z" fill="url(#low)"/>
    <path d="M10 31v4l22 11 22-11v-4L32 42Z" fill="#5420b8"/>
    <path d="M32 20 54 31 32 42 10 31Z" fill="url(#mid)"/>
    <path d="M10 21v4l22 11 22-11v-4L32 32Z" fill="#7c3aed"/>
    <path d="M32 10 54 21 32 32 10 21Z" fill="url(#top)"/>
  </g>
</svg>
