function secretDialog(name = '', usedBy = []) {
  const replace = Boolean(name);
  openDialog(replace ? `Replace ${name}` : 'Create secret', `<div id="dlg-err"></div>
    ${replace ? '' : '<label class="field"><span>Name (as in the compose file\'s <code>secrets:</code>)</span><input type="text" id="sc-name" autocomplete="off" spellcheck="false"></label>'}
    <label class="field"><span>Value</span><textarea id="sc-val" rows="4" autocomplete="off" spellcheck="false"></textarea></label>
    <label class="field"><span>…or read it from a file (at most 64 KB)</span><input type="file" id="sc-file"></label>
    <p class="muted small">The value goes to Podman and is never shown again.</p>`,
    `<button data-close>Cancel</button><button class="primary" id="sc-go">${replace ? 'Replace' : 'Create'}</button>`);
  $('sc-file').addEventListener('change', async () => {
    const f = $('sc-file').files[0];
    if (!f) return;
    if (f.size > 64 * 1024) { $('dlg-err').innerHTML = errBox('The file is larger than 64 KB.'); return; }
    $('sc-val').value = await f.text();
  });
  $('sc-go').addEventListener('click', async () => {
    $('sc-go').disabled = true;
    const body = { name: replace ? name : $('sc-name').value.trim(), value: $('sc-val').value, replace };
    let r;
    try { r = await api('/api/secrets', { method: 'POST', body: JSON.stringify(body) }); }
    catch (e) { $('dlg-err').innerHTML = errBox(e.message); $('sc-go').disabled = false; return; }
    $('sc-val').value = '';
    toast(`${replace ? 'Replaced' : 'Created'} ${body.name}`);
    const users = r.usedBy.length ? r.usedBy : usedBy;
    if (!replace || !users.length) { closeDialog(); viewSecrets(); return; }
    openDialog(`Replaced ${body.name}`,
      `<p>Running containers still see the old value. Recreate the stacks that use it?</p><ul class="plain">${
        users.map((u) => `<li>${esc(u)}</li>`).join('')}</ul><pre id="sc-log" hidden></pre>`,
      `<button data-close>Later</button><button class="primary" id="sc-re">Recreate ${plural(users.length, 'stack')}</button>`);
    $('sc-re').addEventListener('click', async () => {
      $('sc-re').disabled = true;
      const out = $('sc-log');
      out.hidden = false;
      for (const s of users) {
        try {
          const d = await api(`/api/stacks/${enc(s)}/deploy`, { method: 'POST', body: JSON.stringify({ pull: false, recreate: true, onlyUpdate: true, remove: [] }) });
          out.textContent += `${s}: ${d.ok ? 'recreated' : 'failed'}\n${d.ok ? '' : `${d.log.join('\n')}\n`}`;
        } catch (e) { out.textContent += `${s}: failed\n  ${e.message}\n`; }
      }
      $('dlg-foot').innerHTML = '<button data-close>Close</button>';
      load();
    });
    viewSecrets();
  });
}

async function viewSecrets() {
  resPage('Secrets', 'Podman secrets. A compose file uses one with <code>secrets: {name: {external: true}}</code>; the container reads it under <code>/run/secrets/</code>. Values are never shown.', 'Create secret');
  $('res-add').addEventListener('click', () => secretDialog());

    <div class="table res"><div class="tr th"><span>Name</span><span>Changed</span><span>Used by</span><span></span></div>${
    d.secrets.map((s) => `<div class="tr"><span><b>${esc(s.name)}</b></span>
      <span class="small muted">${esc(new Date(s.updated || s.created).toLocaleString())}</span>
      <span class="small">${s.usedBy.length ? s.usedBy.map((u) => `<a href="#/stacks/${enc(u)}/summary">${esc(u)}</a>`).join(', ') : '<span class="tag t-idle">Unused</span>'}</span>
      <span class="r"><button class="small" data-rep="${esc(s.name)}">Replace</button>${s.usedBy.length || s.protected ? ''

    secretDialog(b.dataset.rep, d.secrets.find((s) => s.name === b.dataset.rep).usedBy)));

function viewImages() {
  $('view').innerHTML = `
    <div class="page-head">
      <div><h1>Images</h1><p class="sub">The images on this host. <i>Clean up</i> removes only untagged images that no container uses:

      <div class="head-actions">
        <button id="img-pull" ${INFO.podman ? '' : 'hidden'}>${icon('plus')}<span>Pull image</span></button>
        <button id="img-check">${icon('update')}<span>Check for updates</span></button>
        <button class="primary" id="img-clean" disabled>${icon('trash')}<span>Clean up</span></button>
      </div>
    </div>
    <div id="img-body"><p class="muted pad">Loading…</p></div>`;
  $('img-check').addEventListener('click', () => checkUpdates($('img-check')));
  $('img-clean').addEventListener('click', showCleanup);
  $('img-pull').addEventListener('click', showPull);
  if (IMAGES) renderImages();
  loadImages();

async function loadImages() {
  try { IMAGES = await api('/api/images'); }
  catch (e) { if (ROUTE.view === 'images') $('img-body').innerHTML = errBox(e.message); return; }
  renderImages();
}
function renderImages() {
  if (ROUTE.view !== 'images' || !IMAGES || !$('img-body')) return;
  $('img-pull').hidden = !INFO.podman;
  const removable = IMAGES.images.filter((i) => i.removable);
  $('img-clean').disabled = !removable.length;
  $('img-clean').querySelector('span').textContent = removable.length ? `Clean up ${fmtBytes(IMAGES.reclaimable)}` : 'Nothing to clean up';
  const status = {};
  for (const u of Object.values(UPDATES.stacks)) for (const i of u.images) status[i.image] = i;
  const modules = new Set(STACKS.map((s) => s.name));
  const row = (img) => {
    const upd = img.tags.map((t) => status[t]).find(Boolean);
    const updTag = !upd ? '<span class="muted small">—</span>'
      : upd.status === 'update' ? '<span class="tag t-warn">Update available</span>'
      : upd.status === 'current' ? '<span class="tag t-ok">Up to date</span>'
      : upd.status === 'local' ? '<span class="tag t-idle">Built here</span>' : `<span class="tag t-idle" title="${esc(upd.message)}">Check failed</span>`;
    const used = img.usedBy.length
      ? img.usedBy.map((u) => (modules.has(u) ? `<a href="#/stacks/${enc(u)}/summary">${esc(u)}</a>` : esc(u))).join(', ')
      : img.removable ? '<span class="tag t-idle">Unused, can be removed</span>' : '<span class="muted small">Unused</span>';
    return `<div class="tr">
      <span class="i-name c-name"><span class="name">${img.tags[0] ? esc(img.tags[0]) : '<span class="muted">Untagged</span>'}</span>
        <span class="files">${esc(img.id.slice(0, 12))}${img.tags.length > 1 ? `, also ${img.tags.slice(1).map(esc).join(', ')}` : ''}</span></span>
      <span class="i-size small">${fmtBytes(img.size)}</span>
      <span class="i-created small muted">${esc(ago(img.created))}</span>
      <span class="i-used small">${used}</span>
      <span class="i-upd">${updTag}</span>
      <span class="i-act r">${INFO.podman ? `<button class="icon-btn" data-im="${esc(img.id)}" title="More" aria-label="More actions for ${esc(img.tags[0] || img.id.slice(0, 12))}" aria-haspopup="menu">${icon('more', 'fill')}</button>` : ''}</span></div>`;
  };
  $('img-body').innerHTML = IMAGES.images.length
    ? `<div class="table images"><div class="tr th"><span>Image</span><span>Size</span><span>Created</span><span>Used by</span><span>Update</span><span></span></div>${IMAGES.images.map(row).join('')}</div>`
    : '<div class="table"><div class="empty">No image on this host.</div></div>';
  $('img-body').querySelectorAll('[data-im]').forEach((b) => b.addEventListener('click', () => {
    const img = IMAGES.images.find((i) => i.id === b.dataset.im);
    openMenu(b, [
      { label: 'Details', run: () => showImageDetails(img) },
      { label: 'Tag…', run: () => showTag(img) },
      { sep: true },
      { label: img.usedBy.length ? 'Remove (in use)' : 'Remove…', danger: true, disabled: Boolean(img.usedBy.length), run: () => showImageRemove(img) },
    ]);
  }));
}

function viewResources() {
  $('view').innerHTML = `
    <div class="page-head">
      <div><h1>Resources</h1><p class="sub">CPU and memory of the running containers, the largest memory use first. CPU is a share of the whole host: every core together is 100 %.</p></div>
      <div class="head-actions"><button class="icon-btn" id="res-reload" title="Reload" aria-label="Reload">${icon('refresh')}</button></div>
    </div>
    <div id="res-body"><p class="muted pad">Loading…</p></div>`;
  $('res-reload').addEventListener('click', loadResources);
  renderResources();
}
function renderResources() {
  if (ROUTE.view !== 'resources' || !$('res-body') || !RES) return;
  const h = RES.host;
  const owner = (name) => (STACKS.find((s) => s.containers.some((c) => c.name === name)) || {}).name || '';
  const rows = Object.entries(RES.containers).sort((a, b) => b[1].mem - a[1].mem || a[0].localeCompare(b[0]));
  const hostPanel = h ? `<section class="panel"><dl class="kv">
      <dt>Memory</dt><dd>${usageBar(h.memUsed, h.memTotal, BAR_CLASS[memClass(h.memUsed, h.memTotal)])} ${fmtMem(h.memUsed)} / ${fmtMem(h.memTotal)}</dd>
      <dt>CPU</dt><dd>${usageBar(h.cpu || 0, 100, 'b-idle')} ${fmtCpu(h.cpu)} of ${h.cpus} cores</dd></dl></section>` : '';
  const table = rows.length ? `<div class="table usage"><div class="tr th"><span>Container</span><span>Stack</span><span>CPU</span><span>Memory</span><span>Limit</span><span>PIDs</span></div>${
    rows.map(([name, r]) => {
      const stack = owner(name);
      return `<div class="tr"><span><b>${esc(name)}</b></span>
        <span>${stack ? `<a class="tag t-idle" href="#/stacks/${enc(stack)}/summary">${esc(stack)}</a>` : '<span class="muted small">—</span>'}</span>
        <span class="small">${fmtCpu(r.cpu)}</span>
        <span class="small">${usageBar(r.mem, r.limit || (h ? h.memTotal : 0), BAR_CLASS[memClass(r.mem, r.limit)])} ${fmtMem(r.mem)}</span>
        <span class="small">${r.limit ? fmtMem(r.limit) : 'no limit'}</span>
        <span class="small">${r.pids}</span></div>`;
    }).join('')}</div>` : '<div class="empty">No container is running.</div>';
  $('res-body').innerHTML = `${RES.error ? errBox(RES.error) : ''}${hostPanel}${table}`;
}

      <div id="tok-msg"></div>
      <p class="muted small">${st.tokenSet ? 'A token is set.' : 'No token yet.'} Scripts (e.g. <code>client/stack-ui-client.py</code>) send it;
        it opens the API except these settings, never the page. Only its SHA-256 is kept; it is shown once.</p>
      <div class="head-actions" style="justify-content:flex-end">
        ${st.tokenSet ? '<button id="tok-revoke" class="danger">Revoke</button>' : ''}<button id="tok-new">${st.tokenSet ? 'Generate a new one' : 'Generate'}</button></div>
    </section>
    <section class="panel" style="max-width:640px">
      <h2>Resource numbers</h2>
      <p class="muted small">How often the CPU and memory numbers are read while a page that shows them is open (never while this tab is hidden). Kept in this browser.</p>
      <label class="field"><span>Refresh</span><select id="res-refresh">${REFRESH_CHOICES.map((v) =>
        `<option value="${v}" ${v === REFRESH ? 'selected' : ''}>${v ? `every ${v} s` : 'Off (only the reload buttons)'}</option>`).join('')}</select></label>
    </section>`;
  $('res-refresh').addEventListener('change', (e) => {
    REFRESH = Number(e.target.value);

    scheduleResources();
    toast(REFRESH ? `Resource numbers: every ${REFRESH} s` : 'Resource numbers: only when reloaded');
  });
  const tokenCall = async (revoke) => {
    try {
      const r = await api('/api/settings/token', { method: 'POST', body: JSON.stringify({ revoke }) });
      $('tok-msg').innerHTML = r.token
        ? `<div class="ok-note">New token (copy it now; it is not shown again):</div><pre>${esc(r.token)}</pre>`
        : '<div class="ok-note">The token is revoked.</div>';
    } catch (e) { $('tok-msg').innerHTML = `<div class="bad-note">${esc(e.message)}</div>`; }
  };
  $('tok-new').addEventListener('click', () => {
    if (!st.tokenSet || confirm('The current token stops working. Generate a new one?')) tokenCall(false);
  });
  $('tok-revoke')?.addEventListener('click', () => { if (confirm('Revoke the token? Scripts using it stop working.')) tokenCall(true); });
}

document.querySelector('[data-nav="settings"]').innerHTML = `${icon('settings')}<span>Settings</span>`;
for (const [k, label] of [['containers', 'Containers'], ['resources', 'Resources'], ['logs', 'Logs'], ['networks', 'Networks'], ['volumes', 'Volumes'], ['secrets', 'Secrets']]) {
  document.querySelector(`[data-nav="${k}"]`).innerHTML = `${icon(k)}<span>${label}</span>`;
}
$('theme').innerHTML = `${icon('theme')}<span>Theme</span>`;
$('logout').innerHTML = `${icon('logout')}<span>Sign out</span>`;
if (AUTH) {
  $('logout').hidden = false;
  $('logout').addEventListener('click', async () => {
    if (DIRTY && !confirm('The files have unsaved changes. Sign out without saving them?')) return;
    DIRTY = false;
    await fetch('/logout', { method: 'POST', headers: { 'X-UI-Token': TOKEN } });
    location.replace('/');
  });
}
function applyTheme(t) { if (t === 'light') document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme; }
try { applyTheme(localStorage.getItem('stack-ui-theme')); } catch { /* storage unavailable */ }
$('theme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem('stack-ui-theme', next); } catch { /* storage unavailable */ }
});

scheduleResources();
render();
load();
</script>
</body>
</html>
