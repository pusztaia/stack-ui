function renderImages() {
  if (ROUTE.view !== 'images' || !IMAGES || !$('img-body')) return;
  $('img-pull').hidden = !INFO.podman;
  const removable = IMAGES.images.filter((i) => i.removable);
  $('img-clean').disabled = !removable.length;
  $('img-clean').querySelector('span').textContent = removable.length ? `Clean up ${fmtBytes(IMAGES.reclaimable)}` : 'Nothing to clean up';
  const status = {};
  for (const u of Object.values(UPDATES.stacks)) for (const i of u.images) status[i.image] = i;
  const modules = new Set(STACKS.map((s) => s.name));
  const row = (img) => {
    const upd = img.tags.map((t) => status[t]).find(Boolean);
    const updTag = !upd ? '<span class="muted small">—</span>'
      : upd.status === 'update' ? '<span class="tag t-warn">Update available</span>'
      : upd.status === 'current' ? '<span class="tag t-ok">Up to date</span>'
      : upd.status === 'local' ? '<span class="tag t-idle">Built here</span>' : `<span class="tag t-idle" title="${esc(upd.message)}">Check failed</span>`;
    const used = img.usedBy.length
      ? img.usedBy.map((u) => (modules.has(u) ? `<a href="#/stacks/${enc(u)}/summary">${esc(u)}</a>` : esc(u))).join(', ')
      : img.removable ? '<span class="tag t-idle">Unused, can be removed</span>' : '<span class="muted small">Unused</span>';
    return `<div class="tr">
      <span class="i-name c-name"><span class="name">${img.tags[0] ? esc(img.tags[0]) : '<span class="muted">Untagged</span>'}</span>
        <span class="files">${esc(img.id.slice(0, 12))}${img.tags.length > 1 ? `, also ${img.tags.slice(1).map(esc).join(', ')}` : ''}</span></span>
      <span class="i-size small">${fmtBytes(img.size)}</span>
      <span class="i-created small muted">${esc(ago(img.created))}</span>
      <span class="i-used small">${used}</span>
      <span class="i-upd">${updTag}</span>
      <span class="i-act r">${INFO.podman ? `<button class="icon-btn" data-im="${esc(img.id)}" title="More" aria-label="More actions for ${esc(img.tags[0] || img.id.slice(0, 12))}" aria-haspopup="menu">${icon('more', 'fill')}</button>` : ''}</span></div>`;
  };
  $('img-body').innerHTML = IMAGES.images.length
    ? `<div class="table images"><div class="tr th"><span>Image</span><span>Size</span><span>Created</span><span>Used by</span><span>Update</span><span></span></div>${IMAGES.images.map(row).join('')}</div>`
    : '<div class="table"><div class="empty">No image on the Pi.</div></div>';
  $('img-body').querySelectorAll('[data-im]').forEach((b) => b.addEventListener('click', () => {
    const img = IMAGES.images.find((i) => i.id === b.dataset.im);
    openMenu(b, [
      { label: 'Details', run: () => showImageDetails(img) },
      { label: 'Tag…', run: () => showTag(img) },
      { sep: true },
      { label: img.usedBy.length ? 'Remove (in use)' : 'Remove…', danger: true, disabled: Boolean(img.usedBy.length), run: () => showImageRemove(img) },
    ]);
  }));
}

function showPull() {
  openDialog('Pull image', `<div id="dlg-err"></div>
    <label class="field"><span>Image (anonymous pull)</span><input type="text" id="pl-ref" placeholder="docker.io/library/nginx:1.27" autocomplete="off" spellcheck="false"></label>
    <p class="muted small">A pull can take minutes on the Pi. It does not update any stack: <i>Update</i> does that.</p>`,
  '<button data-close>Cancel</button><button class="primary" id="pl-go">Pull</button>');
  $('pl-ref').focus();
  $('pl-go').addEventListener('click', async () => {
    $('pl-go').disabled = true; $('pl-go').textContent = 'Pulling…';
    try {
      const r = await api('/api/images/pull', { method: 'POST', body: JSON.stringify({ reference: $('pl-ref').value.trim() }) });
      closeDialog(); toast(`Pulled ${r.pulled}`); loadImages();
    } catch (e) { $('dlg-err').innerHTML = errBox(e.message); $('pl-go').disabled = false; $('pl-go').textContent = 'Pull'; }
  });
}
async function showImageDetails(img) {
  openDialog('Image details', '<p class="muted">Loading…</p>');
  let d;
  try { d = await api(`/api/images/${enc(img.id)}/inspect`); }
  catch (e) { openDialog('Image details', errBox(e.message)); return; }
  const labels = Object.entries(d.labels);
  openDialog('Image details', `<dl class="kv">
    <dt>Id</dt><dd><code>${esc(d.id.slice(0, 12))}</code></dd>
    <dt>Tags</dt><dd>${d.tags.map(esc).join('<br>') || '<span class="muted">Untagged</span>'}</dd>
    <dt>Digests</dt><dd class="small">${d.digests.map(esc).join('<br>') || '—'}</dd>
    <dt>Size</dt><dd>${fmtBytes(d.size)}, ${d.layers} layers</dd>
    <dt>Platform</dt><dd>${esc(d.os)}/${esc(d.architecture)}</dd>
    <dt>Created</dt><dd>${esc(ago(d.created))}</dd>
    <dt>Used by</dt><dd>${d.usedBy.map(esc).join(', ') || '—'}</dd>
    <dt>Labels</dt><dd class="small">${labels.map(([k, v]) => `${esc(k)}=${esc(v)}`).join('<br>') || '—'}</dd></dl>`);
}
function showTag(img) {
  openDialog('Tag image', `<div id="dlg-err"></div><p>Adds a name to <code>${esc(img.tags[0] || img.id.slice(0, 12))}</code>.</p>
    <label class="field"><span>Repository</span><input type="text" id="tg-repo" placeholder="localhost/nginx" autocomplete="off" spellcheck="false"></label>
    <label class="field"><span>Tag</span><input type="text" id="tg-tag" placeholder="keep" autocomplete="off" spellcheck="false"></label>`,
  '<button data-close>Cancel</button><button class="primary" id="tg-go">Tag</button>');
  $('tg-go').addEventListener('click', async () => {
    $('tg-go').disabled = true;
    try {
      const r = await api('/api/images/tag', { method: 'POST', body: JSON.stringify({ id: img.id, repo: $('tg-repo').value.trim(), tag: $('tg-tag').value.trim() }) });
      closeDialog(); toast(`Tagged ${r.tagged}`); loadImages();
    } catch (e) { $('dlg-err').innerHTML = errBox(e.message); $('tg-go').disabled = false; }
  });
}
function showImageRemove(img) {
  openDialog('Remove image', `<div id="dlg-err"></div><p>Removes <code>${esc(img.tags[0] || img.id.slice(0, 12))}</code>${
    img.tags.length > 1 ? ` and its other names (${img.tags.slice(1).map(esc).join(', ')})` : ''}, ${fmtBytes(img.size)}. No container uses it.</p>`,
  '<button data-close>Cancel</button><button class="danger" id="ir-go">Remove</button>');
  $('ir-go').addEventListener('click', async () => {
    $('ir-go').disabled = true;
    try {
      const r = await api('/api/images/delete', { method: 'POST', body: JSON.stringify({ id: img.id }) });
      closeDialog(); toast(`Removed the image, freed ${fmtBytes(r.freed)}`); loadImages();
    } catch (e) { $('dlg-err').innerHTML = errBox(e.message); $('ir-go').disabled = false; }
  });
}

async function showCleanup() {
  openDialog('Clean up images', '<p class="muted">Looking for old images…</p>');
  let data;
  try { data = await api('/api/images'); }
  catch (e) { return openDialog('Clean up images', errBox(e.message)); }
  const rm = data.images.filter((i) => i.removable);
  if (!rm.length) return openDialog('Clean up images', '<p>Nothing to clean up: every image is tagged or used by a container.</p>');
  openDialog('Clean up images',
    `<p>Removes ${plural(rm.length, 'untagged image')} that no container uses and frees ${fmtBytes(data.reclaimable)}.
        Tagged images and the images of every container, running or stopped, stay.</p>
     <ul class="plain">${rm.map((i) => `<li><code>${esc(i.id.slice(0, 12))}</code>, ${fmtBytes(i.size)}, created ${esc(ago(i.created))}</li>`).join('')}</ul>
     <div id="dlg-err"></div>`,
    `<button data-close>Cancel</button><button class="danger" id="do-clean">Remove ${plural(rm.length, 'image')}</button>`);
  $('do-clean').addEventListener('click', async () => {
    $('do-clean').disabled = true; $('do-clean').textContent = 'Removing…';
    try {
      const r = await api('/api/images/prune', { method: 'POST', body: JSON.stringify({ ids: rm.map((i) => i.id) }) });
      closeDialog();
      toast(`Removed ${plural(r.removed.length, 'image')}, freed ${fmtBytes(r.freed)}`);
      if (r.errors.length) toast(`Not removed: ${r.errors.join(', ')}`, 'bad');
    } catch (e) {
      $('dlg-err').innerHTML = errBox(e.message); $('do-clean').disabled = false; $('do-clean').textContent = `Remove ${plural(rm.length, 'image')}`;
    }
    if (ROUTE.view === 'images') loadImages();
  });
}

// ---------- settings ----------
async function viewSettings() {
  $('view').innerHTML = '<div class="page-head"><div><h1>Settings</h1></div></div><p class="muted pad">Loading…</p>';
  let st;
  try { st = await api('/api/settings'); }
  catch (e) { if (ROUTE.view === 'settings') $('view').innerHTML = `<div class="page-head"><div><h1>Settings</h1></div></div>${errBox(e.message)}`; return; }
  if (ROUTE.view !== 'settings') return;
  const keyState = st.keySet
    ? `set${st.keyHint ? ` (…${esc(st.keyHint)})` : ''}${st.keySource && st.keySource !== 'settings' ? `, from the ${esc(st.keySource)}` : ''}`
    : 'not set';
  $('view').innerHTML = `
    <div class="page-head"><div><h1>Settings</h1><p class="sub">How this page reaches Portainer and Podman.</p></div></div>
    <section class="panel" style="max-width:640px">
      <div id="set-msg"></div>
      <label class="field"><span>Portainer URL</span>
        <input type="url" id="set-url" value="${esc(st.url)}" placeholder="https://192.168.50.3:9443" autocomplete="off" spellcheck="false"></label>
      <label class="field"><span>API key: ${keyState}</span>
        <input type="password" id="set-key" placeholder="${st.keySet ? 'Leave empty to keep the current key' : 'Portainer → My account → Access tokens'}" autocomplete="off" spellcheck="false"></label>
      <p class="muted small">Stored on the ${esc(SOURCE === 'Pi' ? 'Pi' : 'computer')} in a file only its owner can read (not encrypted).
        The key is never shown again. Portainer's self-signed certificate is accepted.</p>
      <div class="head-actions" style="justify-content:flex-end">
        <button id="set-test">Test connection</button><button class="primary" id="set-save">Save settings</button></div>
    </section>
    <section class="panel" style="max-width:640px">
      <h2>New stacks</h2>
      <label class="field"><span>A stack that runs nowhere yet is created with</span>
        <select id="set-backend"><option value="podman" ${st.defaultBackend === 'podman' ? 'selected' : ''} ${st.podman ? '' : 'disabled'}>Podman (podman-compose)</option>
          <option value="portainer" ${st.defaultBackend === 'portainer' ? 'selected' : ''}>Portainer</option></select></label>
      <p class="muted small">${st.podman ? 'The Podman socket is available here.' : 'There is no Podman socket here: only Portainer can be used.'}
        The Portainer URL and API key are optional when every stack runs with Podman. <i>Save settings</i> above saves this too.</p>
    </section>
    <section class="panel" style="max-width:640px">
      <h2>API token for the deploy scripts</h2>
      <div id="tok-msg"></div>
      <p class="muted small">${st.tokenSet ? 'A token is set.' : 'No token yet.'} The deploy scripts send it; it opens the API except these settings,
        never the page. Put it in <code>portainer-podman-stack/stack-ui-api-token</code> on the workstation. It is shown once.</p>
      <div class="head-actions" style="justify-content:flex-end">
        ${st.tokenSet ? '<button id="tok-revoke" class="danger">Revoke</button>' : ''}<button id="tok-new">${st.tokenSet ? 'Generate a new one' : 'Generate'}</button></div>
    </section>`;
  const msg = (ok, text) => { $('set-msg').innerHTML = `<div class="${ok ? 'ok-note' : 'bad-note'}">${esc(text)}</div>`; };
  const values = () => ({ url: $('set-url').value.trim(), apiKey: $('set-key').value.trim(), defaultBackend: $('set-backend').value });
  const tokenCall = async (revoke) => {
    try {
      const r = await api('/api/settings/token', { method: 'POST', body: JSON.stringify({ revoke }) });
      $('tok-msg').innerHTML = r.token
        ? `<div class="ok-note">New token (copy it now; it is not shown again):</div><pre>${esc(r.token)}</pre>`
        : '<div class="ok-note">The token is revoked.</div>';
    } catch (e) { $('tok-msg').innerHTML = `<div class="bad-note">${esc(e.message)}</div>`; }
  };
  $('tok-new').addEventListener('click', () => {
    if (!st.tokenSet || confirm('The current token stops working. Generate a new one?')) tokenCall(false);
  });
  $('tok-revoke')?.addEventListener('click', () => { if (confirm('Revoke the token? The deploy scripts stop working.')) tokenCall(true); });
  $('set-test').addEventListener('click', async () => {
    $('set-test').disabled = true; msg(true, 'Testing…');
    try { const r = await api('/api/settings/test', { method: 'POST', body: JSON.stringify(values()) }); msg(r.ok, r.message); }
    catch (e) { msg(false, e.message); }
    $('set-test').disabled = false;
  });
  $('set-save').addEventListener('click', async () => {
    $('set-save').disabled = true;
    try {
      await api('/api/settings', { method: 'POST', body: JSON.stringify(values()) });
      toast('Settings saved');
      go('#/stacks');
      load();
    } catch (e) { msg(false, e.message); $('set-save').disabled = false; }
  });
}

// ---------- start ----------
document.querySelector('[data-nav="stacks"]').innerHTML = `${icon('stacks')}<span>Stacks</span>`;
document.querySelector('[data-nav="images"]').innerHTML = `${icon('images')}<span>Images</span>`;
document.querySelector('[data-nav="settings"]').innerHTML = `${icon('settings')}<span>Settings</span>`;
for (const [k, label] of [['containers', 'Containers'], ['logs', 'Logs'], ['networks', 'Networks'], ['volumes', 'Volumes'], ['secrets', 'Secrets']]) {
  document.querySelector(`[data-nav="${k}"]`).innerHTML = `${icon(k)}<span>${label}</span>`;
}
$('theme').innerHTML = `${icon('theme')}<span>Theme</span>`;
$('logout').innerHTML = `${icon('logout')}<span>Sign out</span>`;
if (AUTH) {
  $('logout').hidden = false;
  $('logout').addEventListener('click', async () => {
    if (DIRTY && !confirm('The files have unsaved changes. Sign out without saving them?')) return;
    DIRTY = false;
    await fetch('/logout', { method: 'POST', headers: { 'X-UI-Token': TOKEN } });
    location.replace('/');
  });
}
function applyTheme(t) { if (t === 'light') document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme; }
try { applyTheme(localStorage.getItem('stack-ui-theme')); } catch { /* storage unavailable */ }
$('theme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem('stack-ui-theme', next); } catch { /* storage unavailable */ }
});

render();
load();
api('/api/settings').then((st) => { if (!st.keySet && !st.podman && ROUTE.view !== 'settings') go('#/settings'); }).catch(() => {});
</script>
</body>
</html>
