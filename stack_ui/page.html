<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack UI</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  /* Podman Desktop-like: charcoal layers, one purple accent, status colours only where they mean something */
  :root {
    --nav: #1c1c21; --bg: #26262c; --panel: #2f2f37; --hover: #3a3a43; --line: #3d3d47; --line-soft: #34343c;
    --text: #ececf1; --muted: #a1a1ad; --faint: #7a7a86;
    --accent: #8b5cf6; --accent-strong: #7c3aed; --accent-soft: rgba(139, 92, 246, .16); --accent-text: #ffffff;
    --ok: #34d399; --ok-soft: rgba(52, 211, 153, .14); --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, .14);
    --bad: #f87171; --bad-soft: rgba(248, 113, 113, .14); --idle: #9a9aa6; --idle-soft: rgba(113, 113, 122, .2);
    --code: #1f1f24; --add: #86efac; --add-bg: rgba(52, 211, 153, .12); --del: #fca5a5; --del-bg: rgba(248, 113, 113, .12);
    --hunk: #c4b5fd; --shadow: 0 12px 32px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --nav: #f4f4f7; --bg: #ffffff; --panel: #fafafc; --hover: #f1effa; --line: #e3e3ea; --line-soft: #ececf2;
    --text: #1f1f26; --muted: #5f5f6b; --faint: #8a8a96;
    --accent: #7c3aed; --accent-strong: #6d28d9; --accent-soft: rgba(124, 58, 237, .1); --accent-text: #ffffff;
    --ok: #047857; --ok-soft: rgba(5, 150, 105, .1); --warn: #b45309; --warn-soft: rgba(180, 83, 9, .1);
    --bad: #dc2626; --bad-soft: rgba(220, 38, 38, .09); --idle: #63636e; --idle-soft: rgba(113, 113, 122, .12);
    --code: #f6f6f9; --add: #166534; --add-bg: #dcfce7; --del: #991b1b; --del-bg: #fee2e2;
    --hunk: #6d28d9; --shadow: 0 12px 32px rgba(20, 20, 40, .16);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8;
           stroke-linecap: round; stroke-linejoin: round; }
  svg.ic.fill { fill: currentColor; stroke: none; }

  /* layout */
  .app { display: grid; grid-template-columns: 76px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--nav); border-right: 1px solid var(--line); display: flex; flex-direction: column;
          gap: 4px; padding: 12px 8px; position: sticky; top: 0; height: 100vh; }
  .brand { display: grid; place-items: center; height: 40px; margin-bottom: 10px; color: var(--accent); }
  .brand img { width: 34px; height: 34px; display: block; }
  .nav-a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 4px; border-radius: 8px;
           color: var(--muted); text-decoration: none; font-size: 11px; position: relative; }
  .nav-a svg.ic { width: 20px; height: 20px; }
  .nav-a:hover { background: var(--hover); color: var(--text); }
  .nav-a[aria-current="page"] { color: var(--text); background: var(--accent-soft); }
  .nav-a[aria-current="page"]::before { content: ""; position: absolute; left: -8px; top: 9px; bottom: 9px; width: 3px;
                                        border-radius: 0 3px 3px 0; background: var(--accent); }
  .side .grow { flex: 1; }
  .side button.nav-a { border: 0; background: transparent; font: inherit; font-size: 11px; cursor: pointer; width: 100%; }
  main { padding: 22px 28px 96px; min-width: 0; }
  .content { max-width: 1240px; margin: 0 auto; }

  /* page head */
  .page-head { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 21px; font-weight: 650; letter-spacing: -.01em; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 72ch; }
  .head-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .title-row { display: flex; gap: 12px; align-items: center; }
  .back { display: inline-flex; align-items: center; gap: 2px; color: var(--muted); text-decoration: none; font-size: 13px; margin-bottom: 10px; }
  .back:hover { color: var(--text); }

  /* controls */
  button { font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--accent-text); }
  button.primary:hover { background: var(--accent); border-color: var(--accent); }
  button.danger { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  button.small { padding: 3px 10px; }
  button.icon-btn { padding: 5px; background: transparent; border-color: transparent; color: var(--muted); }
  button.icon-btn:hover { background: var(--hover); color: var(--text); border-color: transparent; }
  button:disabled, button:disabled:hover { opacity: .5; cursor: default; border-color: var(--line); }
  .search { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--code);
            border-radius: 6px; padding: 0 10px; min-width: 250px; color: var(--muted); }
  .search:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
  .search input { border: 0; background: transparent; color: var(--text); font: inherit; font-size: 13px; padding: 7px 0; width: 100%; outline: none; }
  input[type="text"], input[type="password"], input[type="url"], select, textarea {
    font: inherit; width: 100%; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--code); color: var(--text); }
  input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .field { display: block; margin: 12px 0; } .field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  label.check { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0; }

  /* filter chips: the summary of the list, and its filter */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  button.chip { border-radius: 99px; padding: 4px 12px; background: transparent; color: var(--muted); }
  button.chip b { color: var(--text); font-weight: 600; }
  button.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
  button.chip.c-warn b { color: var(--warn); }

  /* tables */
  .table { border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; overflow-y: hidden; background: var(--panel); }
  .tr { display: grid; grid-template-columns: 36px 34px minmax(150px, 1.3fr) minmax(150px, 1.7fr) 130px 104px 140px 124px;
        gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line-soft); }
  .tr:first-child { border-top: 0; }
  .tr.th { font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 8px; padding-bottom: 8px; }
  .tr[data-row] { cursor: pointer; }
  .tr[data-row]:hover { background: var(--hover); }
  .tr.selected { background: var(--accent-soft); }
  .images .tr { grid-template-columns: minmax(220px, 2fr) 84px 110px minmax(150px, 1.4fr) 130px 44px; }
  .conts .tr { grid-template-columns: minmax(120px, 1fr) minmax(140px, 1.6fr) minmax(100px, .9fr) 64px 130px 130px 170px; }
  .c-name { display: flex; flex-direction: column; min-width: 0; }
  .name { color: var(--text); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
  a.name:hover { color: var(--accent); }
  .files { color: var(--faint); font-size: 12px; overflow-wrap: anywhere; }
  .c-cont { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
  .c-act { display: flex; gap: 2px; justify-content: flex-end; }
  .r { text-align: right; }
  .ct { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .d-ok { background: var(--ok); } .d-bad { background: var(--bad); } .d-idle { background: var(--idle); }
  .state { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; }
  .state.big { width: 38px; height: 38px; border-radius: 9px; } .state.big svg.ic { width: 21px; height: 21px; }
  .s-run { background: var(--ok-soft); color: var(--ok); }
  .s-part { background: var(--warn-soft); color: var(--warn); }
  .s-stop { background: var(--idle-soft); color: var(--idle); }
  .s-none { border: 1px dashed var(--line); color: var(--faint); }
  .tag { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 5px; border: 0; white-space: nowrap; }
  button.tag { cursor: pointer; } button.tag:hover { text-decoration: underline; border: 0; }
  .t-ok { background: var(--ok-soft); color: var(--ok); }
  .t-warn { background: var(--warn-soft); color: var(--warn); }
  .t-bad { background: var(--bad-soft); color: var(--bad); }
  .t-idle { background: var(--idle-soft); color: var(--idle); }
  .tag.hl { font-size: 11px; padding: 0 6px; }
  .hostline { display: flex; flex-wrap: wrap; gap: 4px 22px; align-items: center; margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .hostline:empty { display: none; }
  .bar { display: inline-block; width: 90px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; vertical-align: middle; }
  .bar > i { display: block; height: 100%; }
  .usage .tr { grid-template-columns: minmax(150px, 1.3fr) minmax(110px, 1fr) 80px minmax(190px, 1.6fr) 90px 60px; }
  .b-ok > i { background: var(--ok); } .b-warn > i { background: var(--warn); } .b-bad > i { background: var(--bad); } .b-idle > i { background: var(--idle); }
  .muted { color: var(--muted); } .small { font-size: 12.5px; } .pad { padding: 18px 2px; }
  .empty { padding: 28px 18px; text-align: center; color: var(--muted); }

  /* selection bar */
  .selbar { position: sticky; bottom: 18px; display: flex; gap: 10px; align-items: center; width: fit-content;
            margin: 14px auto 0; padding: 8px 10px 8px 16px; background: var(--panel); border: 1px solid var(--accent);
            border-radius: 10px; box-shadow: var(--shadow); }

  /* detail */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 6px 0 16px; overflow-x: auto; }
  .tabs a { padding: 8px 14px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs a:hover { color: var(--text); }
  .tabs a.on { color: var(--text); border-bottom-color: var(--accent); }
  .tabs a.mod::after { content: " •"; color: var(--warn); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .panel > .table { margin: 0 -1px -1px; border-radius: 0 0 10px 10px; }
  dl.kv { display: grid; grid-template-columns: 170px 1fr; gap: 8px 14px; margin: 0; font-size: 13.5px; }
  dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; overflow-wrap: anywhere; }
  .editor-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 12px; }
  .editor-bar .grow { flex: 1; }
  .dirty { color: var(--warn); font-weight: 600; font-size: 13px; }
  .editor { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 14px; background: var(--code); }
  .ed-head { padding: 7px 12px; font-size: 12.5px; color: var(--muted); background: var(--panel); border-bottom: 1px solid var(--line); }
  textarea { display: block; width: 100%; min-height: 46vh; resize: vertical; background: var(--code); color: var(--text); border: 0;
             padding: 12px; tab-size: 2; font: 12.5px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace; }
  textarea.short { min-height: 24vh; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .hist { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 14px; align-items: start; }
  .hist-list { display: grid; gap: 4px; max-height: 64vh; overflow: auto; }
  .hist-list button { display: block; text-align: left; width: 100%; }
  .hist-list button.sel { border-color: var(--accent); background: var(--accent-soft); }
  .hist-list .file { display: block; color: var(--faint); font-size: 12px; overflow-wrap: anywhere; }

  /* code and diffs */
  pre { margin: 0; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto;
        max-height: 52vh; font: 12.5px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; }
  pre .ln { display: block; }
  pre .add { color: var(--add); background: var(--add-bg); }
  pre .del { color: var(--del); background: var(--del-bg); }
  pre .hunk { color: var(--hunk); }
  code { font: 12.5px ui-monospace, "Cascadia Code", Consolas, monospace; }
  h4 { margin: 14px 0 6px; font-size: 13.5px; }
  ul.plain { margin: 6px 0; padding-left: 20px; }
  .banner { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; background: var(--bad-soft); color: var(--bad); }
  .ok-note { padding: 8px 12px; border-radius: 8px; background: var(--ok-soft); color: var(--ok); margin-bottom: 10px; }
  .bad-note { padding: 8px 12px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); margin-bottom: 10px; }
  .warn-note { padding: 8px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); margin-bottom: 10px; }

  /* dialog, menu, toasts */
  dialog { width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 48px); border: 1px solid var(--line);
           border-radius: 12px; padding: 0; background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px;
              border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .dlg-head h3 { margin: 0; font-size: 15px; }
  .dlg-body { padding: 14px 16px; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line);
              position: sticky; bottom: 0; background: var(--panel); }
  .menu { position: fixed; z-index: 30; min-width: 200px; background: var(--panel); border: 1px solid var(--line);
          border-radius: 8px; box-shadow: var(--shadow); padding: 4px; }
  .menu button { display: flex; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 5px; }
  .menu button:hover { background: var(--hover); border: 0; }
  .menu button.danger-text { color: var(--bad); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .toasts { position: fixed; right: 18px; bottom: 18px; z-index: 40; display: grid; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
  .toast { padding: 10px 14px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line);
           border-left: 3px solid var(--ok); box-shadow: var(--shadow); font-size: 13.5px; transition: opacity .25s, transform .25s; }
  .toast.bad { border-left-color: var(--bad); }
  .toast.out { opacity: 0; transform: translateY(6px); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

  /* logs, networks, volumes, secrets */
  .head-actions select { width: auto; }
  pre.logs { max-height: 70vh; overflow: auto; white-space: pre-wrap; word-break: break-all; font-size: 12.5px; }
  .res .tr { grid-template-columns: minmax(160px, 1.2fr) minmax(120px, 1fr) minmax(160px, 1.4fr) 170px; }
  .bk { margin-left: 6px; vertical-align: 1px; }
  .ctab .tr { grid-template-columns: minmax(150px, 1.2fr) minmax(170px, 1.4fr) 110px minmax(120px, 1fr) 330px; }
  .ctab .r button { margin-left: 4px; }
  .ports a { margin-right: 6px; }
  pre.json { max-height: 60vh; overflow: auto; font-size: 12px; }

  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { min-width: 0; flex-direction: row; align-items: center; height: auto; z-index: 10; padding: 6px 8px; border-right: 0;
            border-bottom: 1px solid var(--line); overflow-x: auto; }
    .brand { margin: 0 4px 0 2px; height: auto; }
    .brand img { width: 28px; height: 28px; }
    .nav-a, .side button.nav-a { flex-direction: row; font-size: 12.5px; padding: 7px 10px; width: auto; white-space: nowrap; }
    .nav-a[aria-current="page"]::before { display: none; }
    main { padding: 16px 16px 96px; }
    .search { min-width: 0; flex: 1 1 100%; }
    .head-actions { width: 100%; }
    .table .th { display: none; }
    .stacks .tr { grid-template-columns: 22px 30px minmax(0, 1fr) auto;
                  grid-template-areas: "sel state name act" "sel state cont cont" "sel state mem mem" "sel state drift img"; gap: 6px 10px; }
    .c-sel { grid-area: sel; } .c-state { grid-area: state; } .c-name { grid-area: name; } .c-cont { grid-area: cont; }
    .c-drift { grid-area: drift; } .c-img { grid-area: img; justify-self: start; } .c-act { grid-area: act; } .c-mem { grid-area: mem; }
    .c-drift > .muted, .c-img > .muted, .c-mem > .muted { display: none; }
    .images .tr { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "iname iupd iact" "iused iused iused" "isize icreated icreated"; gap: 4px 10px; }
    .i-act { grid-area: iact; }
    .i-name { grid-area: iname; } .i-upd { grid-area: iupd; } .i-used { grid-area: iused; } .i-size { grid-area: isize; }
    .i-created { grid-area: icreated; justify-self: end; }
    .conts .tr { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "kname kact" "kimg kimg" "kstat kupd" "kcpu kmem"; gap: 4px 10px; }
    .k-name { grid-area: kname; } .k-img { grid-area: kimg; } .k-stat { grid-area: kstat; } .k-upd { grid-area: kupd; } .k-act { grid-area: kact; }
    .k-cpu { grid-area: kcpu; } .k-mem { grid-area: kmem; justify-self: end; }
    .hist { grid-template-columns: 1fr; }
    .res .tr { grid-template-columns: minmax(0, 1fr) auto; }
    .usage .tr { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .ctab .tr { grid-template-columns: minmax(0, 1fr); gap: 4px; }
    dl.kv { grid-template-columns: 1fr; gap: 2px; } dl.kv dd { margin-bottom: 8px; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Main">
    <div class="brand" title="Stack UI"><img src="/icon.svg" alt=""></div>
    <a class="nav-a" href="#/stacks" data-nav="stacks"></a>
    <a class="nav-a" href="#/containers" data-nav="containers"></a>
    <a class="nav-a" href="#/resources" data-nav="resources"></a>
    <a class="nav-a" href="#/images" data-nav="images"></a>
    <a class="nav-a" href="#/logs" data-nav="logs"></a>
    <a class="nav-a" href="#/networks" data-nav="networks"></a>
    <a class="nav-a" href="#/volumes" data-nav="volumes"></a>
    <a class="nav-a" href="#/secrets" data-nav="secrets"></a>
    <a class="nav-a" href="#/settings" data-nav="settings"></a>
    <div class="grow"></div>
    <button class="nav-a" id="theme" title="Switch light / dark"></button>
    <button class="nav-a" id="logout" hidden></button>
  </nav>
  <main><div class="content">
    <div id="banner"></div>
    <div id="view"></div>
  </div></main>
</div>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="toasts" id="toasts"></div>

<dialog id="dlg">
  <div class="dlg-head"><h3 id="dlg-title"></h3><button class="icon-btn" id="dlg-x" aria-label="Close">✕</button></div>
  <div class="dlg-body" id="dlg-body"></div>
  <div class="dlg-foot" id="dlg-foot"></div>
</dialog>

<script>
const TOKEN = '__UI_TOKEN__';
const AUTH = __AUTH__;
const SOURCE = '__SOURCE__';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enc = encodeURIComponent;

const ICON = {
  stacks: '<path d="M12 3 3 7.5l9 4.5 9-4.5L12 3Z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/>',
  images: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="8.5" r="1.5"/>',
  settings: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  play: '<path d="M7 4.6v14.8c0 .8.9 1.3 1.6.8l11-7.4a1 1 0 0 0 0-1.6l-11-7.4c-.7-.5-1.6 0-1.6.8Z"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
  update: '<path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/>',

// ---------- state ----------
let STACKS = [];                                 // /api/stacks
let INFO = { source: SOURCE, podman: true, podmanError: '' };   // podman: the page always has the socket
let LOAD_ERROR = '';
let DRIFT = {}; let DRIFT_LOADED = false;        // name -> {state: same | differs | unknown, changes: [{file, added, removed}]}
let UPDATES = { checkedAt: '', stacks: {} };     // the last image-update check
let IMAGES = null;                               // /api/images
let FILTER = 'all'; let QUERY = '';
let RES = null;                                  // /api/resources: {host, containers, error}
let RES_BUSY = false; let RES_TIMER = null;
const REFRESH_CHOICES = [0, 5, 10, 30, 60];      // seconds between resource readings; 0: only when asked
let REFRESH = 10;
try {
  const saved = localStorage.getItem('stack-ui-refresh');
  if (saved !== null && REFRESH_CHOICES.includes(Number(saved))) REFRESH = Number(saved);
} catch { /* storage unavailable */ }
const SELECTED = new Set();
let ROUTE = { view: 'stacks' };
let FILES = null;                                // the files open on the Files tab
let DIRTY = false; let lastHash = ''; let suppressHash = false;

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { 'X-UI-Token': TOKEN, 'Content-Type': 'application/json' } });
  let data = {};
  try { data = await res.json(); } catch { /* empty */ }
  if (res.status === 401 && AUTH) { location.replace('/'); throw new Error('signed out'); }
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

const stackOf = (name) => STACKS.find((s) => s.name === name);
const errBox = (msg) => `<div class="banner">${esc(msg)}</div>`;
const onTab = (name, tab) => ROUTE.view === 'detail' && ROUTE.name === name && ROUTE.tab === tab;
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

function stackState(s) {
  if (!s.stack) return 'none';
  if (s.stack.status !== 1) return 'stop';
  return s.containers.length && s.containers.every((c) => c.state === 'running') ? 'run' : 'part';
}
const STATE_LABEL = { run: 'Running', part: 'Not every container runs', stop: 'Stopped', none: 'Not deployed' };
const dotClass = (state) => (state === 'running' ? 'd-ok' : state === 'exited' || state === 'dead' ? 'd-bad' : 'd-idle');

function fmtBytes(n) {
  if (!n) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${n < 10 && i ? n.toFixed(1) : Math.round(n)} ${units[i]}`;
}
function ago(sec) {
  if (!sec) return '';
  const d = Date.now() / 1000 - sec;
  if (d < 3600) return `${Math.max(1, Math.round(d / 60))} min ago`;
  if (d < 86400) return `${Math.round(d / 3600)} h ago`;
  const days = Math.round(d / 86400);
  return days < 60 ? `${days} days ago` : new Date(sec * 1000).toLocaleDateString();
}

function diffHtml(text) {
  if (!text) return '<pre class="muted">No difference.</pre>';
  return '<pre>' + text.split('\n').map((l) => {
    const cls = l.startsWith('+++') || l.startsWith('---') ? '' : l.startsWith('+') ? 'add' : l.startsWith('-') ? 'del' : l.startsWith('@@') ? 'hunk' : '';
    return `<span class="ln ${cls}">${esc(l) || ' '}</span>`;
  }).join('') + '</pre>';
}

function toast(msg, kind = 'ok') {
  const t = document.createElement('div');
  t.className = `toast ${kind}`;
  t.setAttribute('role', kind === 'bad' ? 'alert' : 'status');
  t.textContent = msg;
  $('toasts').append(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, kind === 'bad' ? 7000 : 3500);
}

// ---------- dialog and menu ----------
function openDialog(title, body, foot = '') {

function openMenu(anchor, items) {
  const m = $('menu');
  m.innerHTML = items.map((it, i) => it.sep ? '<hr>'
    : `<button role="menuitem" data-i="${i}" class="${it.danger ? 'danger-text' : ''}" ${it.disabled ? 'disabled' : ''}>${esc(it.label)}</button>`).join('');
  m.hidden = false;
  m.dataset.for = anchor.dataset.name || '';
  const r = anchor.getBoundingClientRect();
  const w = m.offsetWidth; const h = m.offsetHeight;
  m.style.left = `${Math.max(8, Math.min(r.right - w, innerWidth - w - 8))}px`;
  m.style.top = `${r.bottom + 4 + h > innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4}px`;
  m.onclick = (e) => {
    const b = e.target.closest('button[data-i]');
    if (!b) return;
    closeMenu();
    items[+b.dataset.i].run();
  };
  m.querySelector('button:not(:disabled)')?.focus();
}
const closeMenu = () => { $('menu').hidden = true; };
document.addEventListener('click', (e) => {
  if (!$('menu').hidden && !e.target.closest('#menu') && !e.target.closest('[data-act="more"], [data-im]')) closeMenu();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

function moreItems(name) {
  const s = stackOf(name);
  const items = [
    { label: 'Edit files', run: () => go(`#/stacks/${enc(name)}/files`) },
    { label: 'History', run: () => go(`#/stacks/${enc(name)}/history`) },
    { label: 'Compare with deployed', disabled: !s?.stack, run: () => go(`#/stacks/${enc(name)}/diff`) },
  ];
  if (s?.stack && !s.protected) items.push({ sep: true }, { label: 'Delete stack…', danger: true, run: () => showDelete(name) });
  return items;
}

// ---------- routing ----------
const TABS = { summary: 'Summary', files: 'Files', history: 'History', diff: 'Compare with deployed' };

function parseHash() {
  const p = location.hash.replace(/^#\/?/, '').split('/').map((x) => { try { return decodeURIComponent(x); } catch { return x; } });
  if (p[0] === 'images') return { view: 'images' };
  if (p[0] === 'settings') return { view: 'settings' };
  if (p[0] === 'containers') return { view: 'containers' };
  if (p[0] === 'resources') return { view: 'resources' };
  if (p[0] === 'logs') return { view: 'logs', container: p[1] || '' };
  if (['networks', 'volumes', 'secrets'].includes(p[0])) return { view: p[0] };
  if (p[0] === 'stacks' && p[1]) return { view: 'detail', name: p[1], tab: TABS[p[2]] ? p[2] : 'summary' };
  return { view: 'stacks' };
}
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
window.addEventListener('hashchange', () => {
  if (suppressHash) { suppressHash = false; return; }
  if (DIRTY && !confirm('The files have unsaved changes. Leave without saving them?')) {
    suppressHash = true;
    location.hash = lastHash;
    return;
  }
  DIRTY = false;
  render();
});
window.addEventListener('beforeunload', (e) => { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });

function render() {
  const previous = ROUTE.view;
  lastHash = location.hash || '#/stacks';
  ROUTE = parseHash();
  closeMenu();
  document.querySelectorAll('[data-nav]').forEach((a) => {
    const on = a.dataset.nav === (ROUTE.view === 'detail' ? 'stacks' : ROUTE.view);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  renderBanner();
  ({ stacks: viewStacks, detail: viewDetail, images: viewImages, settings: viewSettings, containers: viewContainers, resources: viewResources, logs: viewLogs,
     networks: viewNetworks, volumes: viewVolumes, secrets: viewSecrets })[ROUTE.view]();
  if (previous !== ROUTE.view) window.scrollTo(0, 0);
  if (usesResources()) loadResources();
}

function renderBanner() {
  const errs = [];
  if (LOAD_ERROR) errs.push(`The stacks could not be read: ${esc(LOAD_ERROR)}`);
  if (INFO.podmanError) errs.push(`Podman could not be read: ${esc(INFO.podmanError)}`);
  $('banner').innerHTML = ROUTE.view === 'settings' ? '' : errs.map((e) => `<div class="banner">${e}</div>`).join('');
}

/** After new data: redraw what is on screen, without touching an open editor. */
function refreshViews() {
  renderBanner();
  if (ROUTE.view === 'stacks') renderTable();
  if (ROUTE.view === 'detail') {
    if (!$('detail-head')) return viewDetail();
    renderDetailHead();
    if (ROUTE.tab === 'summary') tabSummary(ROUTE.name);
  }
  if (ROUTE.view === 'images') renderImages();
  if (ROUTE.view === 'resources') renderResources();
}

// ---------- data ----------
async function load() {
  try {
    const data = await api('/api/stacks');
    STACKS = data.stacks;
    INFO = { source: data.source, podman: true, podmanError: data.podmanError, hideUndeployed: !!data.hideUndeployed };
    LOAD_ERROR = '';
    for (const n of [...SELECTED]) if (!stackOf(n)?.stack) SELECTED.delete(n);
  } catch (e) {
    LOAD_ERROR = e.message;
  }
  refreshViews();
  loadDrift();
  loadUpdates();
  if (usesResources()) loadResources();
}
async function loadDrift() {
  try { DRIFT = await api('/api/drift'); } catch { DRIFT = {}; }
  DRIFT_LOADED = true;
  refreshViews();
}
async function loadUpdates() {   // no registry call: the last check against what runs now
  try { UPDATES = await api('/api/updates'); } catch { /* keep the last answer */ }
  refreshViews();
}
async function checkUpdates(btn) {
  const label = btn.querySelector('span');
  const old = label.textContent;
  btn.disabled = true; label.textContent = 'Checking…';
  try {
    UPDATES = await api('/api/updates', { method: 'POST', body: '{}' });
    const n = Object.values(UPDATES.stacks).filter((u) => u.status === 'update').length;
    const failed = Object.values(UPDATES.stacks).filter((u) => u.status === 'unknown').length;
    toast(n ? `${plural(n, 'stack')} can be updated to a newer image` : 'Every image is up to date');
    if (failed) toast(`The registry could not be asked for ${plural(failed, 'stack')}; hover its badge for the reason`, 'bad');
    if (n && ROUTE.view === 'stacks') FILTER = 'updates';
  } catch (e) {
    toast(`Update check failed: ${e.message}`, 'bad');
  }
  btn.disabled = false; label.textContent = old;
  refreshViews();
}

// ---------- resource usage (/api/resources: the CPU and memory numbers) ----------
const fmtMem = (n) => (n < 1024 ** 3 ? `${Math.round(n / 1024 ** 2)} MB` : `${(n / 1024 ** 3).toFixed(1)} GB`);
const fmtCpu = (v) => (v === null || v === undefined ? '—' : `${v.toFixed(1)} %`);
// the share of the memory limit in use: a warning from 80 %, bad from 95 %; without a limit no colour
function memClass(used, limit) {
  if (!limit) return '';
  const r = used / limit;
  return r >= 0.95 ? 't-bad' : r >= 0.8 ? 't-warn' : 't-ok';
}
const BAR_CLASS = { 't-ok': 'b-ok', 't-warn': 'b-warn', 't-bad': 'b-bad', '': 'b-idle' };
function usageBar(used, total, cls) {
  const pct = total ? Math.min(100, Math.round((used / total) * 100)) : 0;
  return `<span class="bar ${cls}" role="img" aria-label="${pct} %"><i style="width:${pct}%"></i></span>`;
}
const usageOf = (name) => (RES && RES.containers[name]) || null;
function memTag(u) {   // u: {mem, limit} (limit 0: none) or null
  if (!u) return '<span class="muted small">—</span>';
  const cls = memClass(u.mem, u.limit);
  return `<span class="${cls ? `tag ${cls}` : 'small'}">${fmtMem(u.mem)}${u.limit ? ` / ${fmtMem(u.limit)}` : ''}</span>`;
}
// a stack's running containers: their use over their limits (the limits only count when every one has one)
function stackUsage(s) {
  const rows = s.containers.map((c) => usageOf(c.name)).filter(Boolean);
  if (!rows.length) return null;
  return { mem: rows.reduce((a, r) => a + r.mem, 0), limit: rows.every((r) => r.limit) ? rows.reduce((a, r) => a + r.limit, 0) : 0 };
}
function memCell(s) {
  const u = stackUsage(s);
  if (!u) return `<span class="muted small">${RES ? '—' : '…'}</span>`;
  const title = s.containers.map((c) => {
    const r = usageOf(c.name);
    return r ? `${c.name}: ${fmtMem(r.mem)}${r.limit ? ` / ${fmtMem(r.limit)}` : ' (no limit)'} · CPU ${fmtCpu(r.cpu)}` : '';
  }).filter(Boolean).join('\n');
  return `<span title="${esc(title)}">${memTag(u)}</span>`;
}
function hostLine() {
  const h = RES && RES.host;
  if (!h) return '';
  const cls = memClass(h.memUsed, h.memTotal);
  return `<span>RAM <span class="${cls ? `tag ${cls}` : 'small'}">${fmtMem(h.memUsed)} / ${fmtMem(h.memTotal)}</span></span>
    <span>CPU ${fmtCpu(h.cpu)} of ${h.cpus} cores</span>`;
}
const usesResources = () => ROUTE.view === 'stacks' || ROUTE.view === 'resources' || (ROUTE.view === 'detail' && ROUTE.tab === 'summary');
// new numbers without redrawing the view: a redraw every few seconds would take the keyboard focus and a text selection away
function refreshResourceCells() {
  if (ROUTE.view === 'stacks' && $('hostline')) {
    $('hostline').innerHTML = hostLine();
    document.querySelectorAll('#table [data-row]').forEach((row) => {
      const s = stackOf(row.dataset.row);
      const cell = row.querySelector('.c-mem');
      if (s && cell) cell.innerHTML = memCell(s);
    });
  } else if (ROUTE.view === 'detail' && ROUTE.tab === 'summary' && $('tab')) {
    document.querySelectorAll('#tab .conts .tr[data-container]').forEach((row) => {
      const r = usageOf(row.dataset.container);
      row.querySelector('.k-cpu').textContent = r ? fmtCpu(r.cpu) : '—';
      row.querySelector('.k-mem').innerHTML = memTag(r);
    });
  } else {
    refreshViews();
  }
}
async function loadResources() {
  if (RES_BUSY) return;
  RES_BUSY = true;
  try { RES = await api('/api/resources'); } catch (e) { RES = { host: null, containers: {}, error: e.message }; }
  RES_BUSY = false;
  refreshResourceCells();
}
function scheduleResources() {
  clearInterval(RES_TIMER);
  RES_TIMER = REFRESH ? setInterval(() => { if (!document.hidden && usesResources()) loadResources(); }, REFRESH * 1000) : null;
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && REFRESH && usesResources()) loadResources(); });

// ---------- stacks list ----------
const FILTERS = [
  ['all', 'All', () => true],
  ['running', 'Running', (s) => stackState(s) === 'run'],
  ['partly', 'Not every container runs', (s) => stackState(s) === 'part'],
  ['unhealthy', 'Unhealthy', (s) => s.containers.some((c) => c.status === 'unhealthy')],
  ['stopped', 'Stopped', (s) => stackState(s) === 'stop'],
  ['differs', 'Differs from deployed', (s) => DRIFT[s.name]?.state === 'differs'],
  ['updates', 'Image updates', (s) => UPDATES.stacks[s.name]?.status === 'update'],
  ['outside', 'Not deployed', (s) => !s.stack],
];
// STACK_UI_HIDE_UNDEPLOYED: a folder without containers is not listed (its own page still opens, e.g. after Add stack)
function listedStacks() {
  return INFO.hideUndeployed ? STACKS.filter((s) => s.stack || s.containers.length) : STACKS;
}
function visibleStacks() {
  const f = (FILTERS.find((x) => x[0] === FILTER) || FILTERS[0])[2];
  const q = QUERY.trim().toLowerCase();
  return listedStacks().filter((s) => f(s) && (!q || s.name.includes(q) || s.containers.some((c) => c.name.toLowerCase().includes(q))));
}

function viewStacks() {
  $('view').innerHTML = `
    <div class="page-head">
      <div><h1>Stacks</h1><p class="sub" id="stacks-sub">Loading…</p></div>
      <div class="head-actions">
        <label class="search">${icon('search')}<input id="q" type="search" placeholder="Search stacks and containers" value="${esc(QUERY)}" autocomplete="off" aria-label="Search"></label>
        <button class="icon-btn" id="reload" title="Reload the list" aria-label="Reload the list">${icon('refresh')}</button>
        <button id="add">${icon('plus')}<span>Add stack</span></button>

function driftCell(s) {
  if (!s.stack) return '<span class="muted small">—</span>';
  const d = DRIFT[s.name]?.state;
  if (d === 'same') return '<span class="tag t-ok">Matches</span>';
  if (d === 'differs') {
    const title = DRIFT[s.name].changes.map((c) => `${c.file}: +${c.added} −${c.removed}`).join('\n');
    return `<button class="tag t-warn" data-act="diff" data-name="${esc(s.name)}" title="${esc(`${title}\n(click: the full diff)`)}">Differs</button>`;
  }
  if (d === 'unknown') return '<span class="tag t-idle" title="Not known: no record of the last deploy (the next Update makes one)">Unknown</span>';
  return `<span class="muted small">${DRIFT_LOADED ? '—' : '…'}</span>`;
}
function imageCell(name) {
  const u = UPDATES.stacks[name];
  if (!UPDATES.checkedAt && stackOf(name)?.containers.length) return '<span class="tag t-idle" title="Whether a newer image exists: Check for updates asks the registries">Not checked</span>';
  if (!u || u.status === 'none') return '<span class="muted small">—</span>';
  const title = esc(u.images.map((i) => `${i.container}: ${i.image} – ${i.message}`).join('\n'));
  if (u.status === 'update') return `<button class="tag t-warn" data-act="deploy" data-name="${esc(name)}" title="${title}">Update available</button>`;
  if (u.status === 'current') return `<span class="tag t-ok" title="${title}">Up to date</span>`;
  if (u.status === 'local') return `<span class="tag t-idle" title="${title}">Built here</span>`;
  return `<span class="tag t-idle" title="${title}">Check failed</span>`;
}
function rowActions(s) {
  const n = esc(s.name);
  const st = s.stack;
  if (s.protected) return `<span class="tag t-idle" title="This page itself, or STACK_UI_PROTECTED: not stopped, updated or deleted from here">Protected</span><button class="icon-btn" data-act="more" data-name="${n}" title="More" aria-label="More actions for ${n}" aria-haspopup="menu">${icon('more', 'fill')}</button>`;
  const main = st
    ? `<button class="icon-btn" data-act="${st.status === 1 ? 'stop' : 'start'}" data-name="${n}" title="${st.status === 1 ? 'Stop' : 'Start'}" aria-label="${st.status === 1 ? 'Stop' : 'Start'} ${n}">${icon(st.status === 1 ? 'stop' : 'play', 'fill')}</button>
       <button class="icon-btn" data-act="deploy" data-name="${n}" title="Update" aria-label="Update ${n}">${icon('update')}</button>`
    : `<button class="small primary" data-act="deploy" data-name="${n}">Create</button>`;
  return `${main}<button class="icon-btn" data-act="more" data-name="${n}" title="More" aria-label="More actions for ${n}" aria-haspopup="menu">${icon('more', 'fill')}</button>`;
}
// libpod's container list gives the healthcheck's state as Status (empty without a healthcheck)
function healthTag(status) {
  const cls = { healthy: 't-ok', unhealthy: 't-bad', starting: 't-warn' }[status];
  return cls ? `<span class="tag hl ${cls}" title="Healthcheck">${status}</span>` : '';
}
function stackRow(s) {
  const n = esc(s.name);
  const state = stackState(s);
  const conts = s.containers.length
    ? s.containers.map((c) => `<span class="ct" title="${esc(c.image)} – ${esc(c.status || c.state)}"><i class="dot ${dotClass(c.state)}"></i>${esc(c.name)}${healthTag(c.status)}</span>`).join('')
      + (!s.stack ? '<span class="small">not deployed: Create asks to replace it</span>' : '')
    : '<span class="muted small">No container</span>';
  return `<div class="tr${SELECTED.has(s.name) ? ' selected' : ''}" data-row="${n}">
    <span class="c-sel">${s.stack && !s.protected ? `<input type="checkbox" data-sel="${n}" aria-label="Select ${n}" ${SELECTED.has(s.name) ? 'checked' : ''}>` : ''}</span>
    <span class="c-state"><span class="state s-${state}" title="${STATE_LABEL[state]}">${icon('stacks')}</span></span>
    <span class="c-name"><a class="name" href="#/stacks/${n}/summary">${n}</a><span class="files">${esc(s.compose)}</span></span>
    <span class="c-cont">${conts}</span>
    <span class="c-mem">${memCell(s)}</span>
    <span class="c-drift">${driftCell(s)}</span>
    <span class="c-img">${imageCell(s.name)}</span>
    <span class="c-act">${rowActions(s)}</span>
  </div>`;
}

function renderTable() {
  if (ROUTE.view !== 'stacks' || !$('table')) return;
  $('stacks-sub').textContent = LOAD_ERROR ? 'The stacks could not be read.'
    : 'The compose stacks of this host (STACKS_DIR), run with podman-compose. An update sends these files.'
      + (INFO.hideUndeployed ? ' Folders without containers are not listed.' : '');
  $('hostline').innerHTML = hostLine();
  $('chips').innerHTML = FILTERS.map(([k, label, f]) => {
    const n = listedStacks().filter(f).length;
    if (k !== 'all' && !n && FILTER !== k) return '';
    const warn = k === 'updates' || k === 'differs' || k === 'partly' || k === 'unhealthy';
    return `<button class="chip${FILTER === k ? ' on' : ''}${warn ? ' c-warn' : ''}" data-filter="${k}" aria-pressed="${FILTER === k}">${label} <b>${n}</b></button>`;
  }).join('');
  const rows = visibleStacks();
  const eligible = rows.filter((s) => s.stack);
  const all = eligible.length && eligible.every((s) => SELECTED.has(s.name));
  const head = `<div class="tr th">
    <span><input type="checkbox" data-sel-all aria-label="Select every stack shown" ${all ? 'checked' : ''} ${eligible.length ? '' : 'disabled'}></span>
    <span></span><span>Name</span><span>Containers</span><span>Memory</span><span>Deployed</span><span>Image</span><span class="r">Actions</span></div>`;
  const empty = !listedStacks().length
    ? `<div class="empty">${LOAD_ERROR ? 'No stack to show.' : INFO.hideUndeployed && STACKS.length ? 'No stack has containers yet.'
      : 'No stack yet: put a folder with a compose file into STACKS_DIR, or <i>Add stack</i>.'}</div>`
    : '<div class="empty">No stack matches. <button data-filter="all">Show all</button></div>';
  $('table').innerHTML = head + (rows.length ? rows.map(stackRow).join('') : empty);
  if ($('q') && QUERY && !rows.length) $('table').querySelector('.empty button')?.addEventListener('click', () => { QUERY = ''; $('q').value = ''; });
  const k = [...SELECTED].length;
  $('selbar').innerHTML = k ? `<div class="selbar" role="region" aria-label="Selection"><span><b>${k}</b> selected</span>
      <button data-act="sel-clear">Clear</button>
      <button class="primary" data-act="sel-update">${icon('update')}<span>Update ${k === 1 ? 'it' : `these ${k}`}</span></button></div>` : '';
}

// one set of listeners for every view
$('view').addEventListener('click', (ev) => {
  const chip = ev.target.closest('[data-filter]');
  if (chip) { FILTER = chip.dataset.filter; renderTable(); return; }
  const b = ev.target.closest('[data-act]');
  if (b) { act(b.dataset.act, b.dataset.name, b); return; }
  if (ev.target.closest('input, a, button, label, textarea, select')) return;
  const row = ev.target.closest('[data-row]');
  if (row) go(`#/stacks/${enc(row.dataset.row)}/summary`);
});
$('view').addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.matches('[data-sel-all]')) {
    visibleStacks().filter((s) => s.stack).forEach((s) => (t.checked ? SELECTED.add(s.name) : SELECTED.delete(s.name)));
    renderTable();
  } else if (t.dataset.sel) {
    if (t.checked) SELECTED.add(t.dataset.sel); else SELECTED.delete(t.dataset.sel);
    renderTable();
  }
});

function act(a, name, btn) {
  if (a === 'deploy') return startDeploy(name);
  if (a === 'start' || a === 'stop') return confirmPower(name, a);
  if (a === 'diff') return go(`#/stacks/${enc(name)}/diff`);
  if (a === 'more') return !$('menu').hidden && $('menu').dataset.for === btn.dataset.name ? closeMenu() : openMenu(btn, moreItems(name));
  if (a === 'sel-clear') { SELECTED.clear(); return renderTable(); }
  if (a === 'sel-update') return updateSelected([...SELECTED]);
  if (a === 'restart') return confirmRestart(name, btn.dataset.container);
  if (a === 'logs') return go(`#/logs/${enc(btn.dataset.container)}`);
  if (a === 'save') return saveFlow(name, live(name));
  if (a === 'load-files') return loadFiles(name);
  return undefined;
}

// a running stack's folder never differs from what runs: every change the page makes there is followed by an update
const live = (name) => !!stackOf(name)?.stack;

// ---------- stack detail ----------
function viewDetail() {
  const { name, tab } = ROUTE;
  if (tab !== 'history') HIST_FILE = '';
  const s = stackOf(name);
  if (!s) {
    $('view').innerHTML = `<a class="back" href="#/stacks">${icon('back')}Stacks</a>`
      + (STACKS.length || LOAD_ERROR ? `<div class="empty"><p>There is no stack “${esc(name)}”.</p></div>` : '<p class="muted pad">Loading…</p>');
    return;
  }
  $('view').innerHTML = `
    <a class="back" href="#/stacks">${icon('back')}Stacks</a>
    <div class="page-head" id="detail-head"></div>
    <nav class="tabs" aria-label="Stack">${Object.entries(TABS).map(([t, label]) =>
      `<a href="#/stacks/${enc(name)}/${t}" class="${t === tab ? 'on' : ''}" ${t === tab ? 'aria-current="page"' : ''} data-tab="${t}">${label}</a>`).join('')}</nav>
    <div id="tab"></div>`;
  renderDetailHead();
  ({ summary: tabSummary, files: tabFiles, history: tabHistory, diff: tabDiff })[tab](name);
}

function renderDetailHead() {
  const s = stackOf(ROUTE.name);
  if (!s || !$('detail-head')) return;
  const st = s.stack;
  const state = stackState(s);
  const n = esc(s.name);
  $('detail-head').innerHTML = `
    <div class="title-row"><span class="state big s-${state}">${icon('stacks')}</span>
      <div><h1>${n}</h1><p class="sub">${STATE_LABEL[state]}</p></div></div>
    <div class="head-actions">
      ${s.protected ? '<span class="tag t-idle">Protected: not stopped, updated or deleted from here</span>' : `${st ? `<button data-act="${st.status === 1 ? 'stop' : 'start'}" data-name="${n}">${icon(st.status === 1 ? 'stop' : 'play', 'fill')}<span>${st.status === 1 ? 'Stop' : 'Start'}</span></button>` : ''}
      <button class="primary" data-act="deploy" data-name="${n}">${icon('update')}<span>${st ? 'Update' : 'Create'}</span></button>`}
      <button class="icon-btn" data-act="more" data-name="${n}" title="More" aria-label="More actions" aria-haspopup="menu">${icon('more', 'fill')}</button>
    </div>`;
}

function tabSummary(name) {
  const s = stackOf(name);
  if (!s || !$('tab')) return;
  const st = s.stack;
  const u = UPDATES.stacks[name];
  const updTag = (cname) => {
    const i = u?.images.find((x) => x.container === cname);
    if (!i) return '<span class="muted small">—</span>';
    const cls = i.status === 'update' ? 't-warn' : i.status === 'current' ? 't-ok' : 't-idle';
    const text = { update: 'Update available', current: 'Up to date', local: 'Built here', unknown: 'Check failed' }[i.status] || '—';
    return `<span class="tag ${cls}" title="${esc(i.message)}">${text}</span>`;
  };
  const rows = s.containers.map((c) => `<div class="tr" data-container="${esc(c.name)}">
      <span class="k-name ct"><i class="dot ${dotClass(c.state)}"></i><b>${esc(c.name)}</b></span>
      <span class="k-img files">${esc(c.image)}</span>
      <span class="k-stat small muted">${esc(c.state)} ${healthTag(c.status)}</span>
      <span class="k-cpu small">${usageOf(c.name) ? fmtCpu(usageOf(c.name).cpu) : '—'}</span>
      <span class="k-mem">${memTag(usageOf(c.name))}</span>
      <span class="k-upd">${updTag(c.name)}</span>
      <span class="k-act r">${INFO.podman ? `<button class="small" data-act="logs" data-container="${esc(c.name)}">${icon('logs')}Logs</button>` : ''}<button class="small" data-act="restart" data-name="${esc(name)}" data-container="${esc(c.name)}">${icon('refresh')}Restart</button></span>
    </div>`).join('');
  const none = st ? 'The stack has no container. <i>Update</i> starts them again.'
    : 'The stack is not deployed yet: <i>Create</i> starts it.';
  $('tab').innerHTML = `
    <section class="panel"><h2>Containers</h2>
      ${s.containers.length ? `<div class="table conts"><div class="tr th"><span>Name</span><span>Image</span><span>Status</span><span>CPU</span><span>Memory</span><span>Image update</span><span></span></div>${rows}</div>`
        : `<p class="muted">${none}</p>`}
    </section>
    <section class="panel"><h2>Details</h2>
      <dl class="kv">
        <dt>Runs with</dt><dd>${st ? `podman-compose project ${esc(name)}` : 'Not deployed yet'}</dd>
        <dt>Compared with deployed</dt><dd>${driftCell(s)}</dd>
        <dt>Compose file</dt><dd><code>${esc(s.compose)}</code></dd>
        <dt>Env file</dt><dd><code>${esc(s.env)}</code></dd>
        <dt>Last image check</dt><dd>${UPDATES.checkedAt ? esc(new Date(UPDATES.checkedAt).toLocaleString()) : 'Not checked yet'}</dd>
      </dl>
    </section>`;
}

async function tabFiles(name) {
  $('tab').innerHTML = '<p class="muted pad">Loading…</p>';
  let f;
  try { f = await api(`/api/stacks/${enc(name)}/files`); }
  catch (e) { if (onTab(name, 'files')) $('tab').innerHTML = errBox(e.message); return; }
  if (!onTab(name, 'files')) return;
  FILES = { name, ...f };
  DIRTY = false;
  const list = f.stackFiles.length ? `<section class="panel"><h2>Other files</h2>
      <p class="muted small">Scripts, configs and dashboards the compose file can mount (<code>./name</code>). They come from your folder or a script (<code>stack-ui-client.py</code>); here you can look at them.</p>
      <div class="table res"><div class="tr th"><span>Name</span><span>Size</span><span>Since deploy</span><span></span></div>${
      f.stackFiles.map((x) => `<div class="tr"><span><b>${esc(x.name)}</b></span><span class="small">${fmtBytes(x.size)}</span>
        <span>${x.changed === null ? '<span class="muted small">—</span>' : x.changed ? '<span class="tag t-warn">Changed</span>' : '<span class="tag t-ok">Same</span>'}</span>
        <span class="r"><button class="small" data-sf="view" data-f="${esc(x.name)}">View</button><button class="small" data-sf="diff" data-f="${esc(x.name)}" ${x.changed === null ? 'disabled' : ''}>Diff</button><button class="small" data-sf="history" data-f="${esc(x.name)}">History</button><button class="small danger" data-sf="delete" data-f="${esc(x.name)}">${icon('trash')}Delete</button></span></div>`).join('')}</div></section>` : '';
  $('tab').innerHTML = `
    <div class="editor-bar">
      <span id="dirty" class="dirty" hidden>Unsaved changes</span>
      <span class="muted small">Ctrl+S ${live(name) ? 'saves and updates' : 'saves'}. Each save keeps the previous file in the history.</span>
      <span class="grow"></span>
      <button data-act="load-files" data-name="${esc(name)}">Load from files…</button>
      <button class="primary" data-act="save" data-name="${esc(name)}">${live(name) ? 'Save and update' : 'Save'}</button>
    </div>
    <div id="save-err"></div>
    <section class="editor"><div class="ed-head">${esc(f.compose)}</div><textarea id="compose-text" spellcheck="false" aria-label="${esc(f.compose)}">${esc(f.composeText)}</textarea></section>
    ${f.envText === null ? '<section class="editor"><p class="muted small pad">This stack has no env file.</p></section>'
      : `<section class="editor"><div class="ed-head">${esc(f.env)}</div><textarea id="env-text" class="short" spellcheck="false" aria-label="${esc(f.env)}">${esc(f.envText)}</textarea></section>`}
    <p class="muted small">A save checks the compose file and the variables (no secrets in the env file).${live(name)
      ? ' The stack runs, so every save updates it (without a pull): its folder stays what runs.' : ''}</p>
    ${list}`;
  const mark = () => {
    DIRTY = $('compose-text').value !== FILES.composeText || ($('env-text') ? $('env-text').value !== FILES.envText : false);
    $('dirty').hidden = !DIRTY;
    document.querySelector('.tabs a[data-tab="files"]')?.classList.toggle('mod', DIRTY);
  };
  $('compose-text').addEventListener('input', mark);
  $('env-text')?.addEventListener('input', mark);
  $('tab').querySelectorAll('[data-sf]').forEach((b) => b.addEventListener('click', () => stackFileAction(name, b.dataset.sf, b.dataset.f)));
}

let HIST_FILE = '';
async function stackFileAction(name, act, file) {
  if (act === 'history') { HIST_FILE = file; go(`#/stacks/${enc(name)}/history`); return; }
  if (act === 'view' || act === 'diff') {
    openDialog(file, '<p class="muted">Loading…</p>');
    try {
      if (act === 'view') {
        const r = await api(`/api/stacks/${enc(name)}/files/${enc(file)}`);
        openDialog(file, `<pre class="json">${esc(r.text)}</pre>`);
      } else {
        const d = await api(`/api/stacks/${enc(name)}/diff`);
        openDialog(`${file}: since deploy`, `<p class="muted small">− is what was deployed last; + is the file now.</p>${diffHtml((d.files || {})[file] || '')}`);
      }
    } catch (e) { openDialog(file, errBox(e.message)); }
    return;
  }
  const andUpdate = live(name);
  openDialog(`Delete ${file}`, `<div id="dlg-err"></div><p>Deletes <b>${esc(file)}</b> from the stack's folder${andUpdate ? ', then updates the stack (without a pull)' : ''}. Its last version stays in the history (restorable there).</p>${driftNote(name, andUpdate)}`,
    `<button data-close>Cancel</button><button class="danger" id="sf-del">${andUpdate ? 'Delete and update' : 'Delete'}</button>`);
  $('sf-del').addEventListener('click', async () => {
    $('sf-del').disabled = true;
    try {
      await api(`/api/stacks/${enc(name)}/files/delete`, { method: 'POST', body: JSON.stringify({ file }) });
      closeDialog(); toast(`Deleted ${file}`); tabFiles(name);
      if (andUpdate) updateAfterSave(name);
    } catch (e) { $('dlg-err').innerHTML = errBox(e.message); $('sf-del').disabled = false; }
  });
}

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && ROUTE.view === 'detail' && ROUTE.tab === 'files' && FILES) {
    e.preventDefault();
    if (!$('dlg').open) saveFlow(ROUTE.name, live(ROUTE.name));
  }
});

async function saveFlow(name, andUpdate) {
  if (!FILES || FILES.name !== name || !$('compose-text')) return;
  const body = JSON.stringify({ composeText: $('compose-text').value, envText: $('env-text') ? $('env-text').value : null });
  $('save-err').innerHTML = '';
  let p;
  try { p = await api(`/api/stacks/${enc(name)}/files/preview`, { method: 'POST', body }); }
  catch (e) { $('save-err').innerHTML = errBox(e.message); return; }
  if (!p.compose && !p.env) return toast('Nothing to save: the files are unchanged');
  const label = andUpdate ? 'Save and update' : 'Save';
  openDialog(`Save ${name}`,
    `${driftNote(name, andUpdate)}<p class="muted">− is the file in the stack's folder now, + is what will be saved${andUpdate ? ' and deployed' : ''}.</p>
     ${p.compose ? `<h4>${esc(FILES.compose)}</h4>${diffHtml(p.compose)}` : ''}
     ${p.env ? `<h4>${esc(FILES.env)}</h4>${diffHtml(p.env)}` : ''}<div id="dlg-err"></div>`,
    `<button data-close>Cancel</button><button class="primary" id="do-save">${label}</button>`);
  $('do-save').addEventListener('click', async () => {
    $('do-save').disabled = true;
    try {
      const r = await api(`/api/stacks/${enc(name)}/files`, { method: 'POST', body });
      DIRTY = false;
      closeDialog();
      toast(r.saved.length ? `Saved ${r.saved.join(' and ')}` : 'Nothing to save: the files are unchanged');
      if (onTab(name, 'files')) tabFiles(name);
      loadDrift();
      if (andUpdate) updateAfterSave(name);
    } catch (e) {
      $('dlg-err').innerHTML = errBox(e.message);
      $('do-save').disabled = false;
    }
  });
}

function driftNote(name, andUpdate) {
  return andUpdate && DRIFT[name]?.state === 'differs'
    ? '<div class="warn-note">The stack\'s folder already differs from what was deployed last (<i>Compare with deployed</i> tab): the update deploys those changes too.</div>' : '';
}

// the compose and env file chosen here replace the editors' text (whatever their names); the save dialog then shows
// the difference to the stack's folder
function loadFiles(name) {
  if (!FILES || FILES.name !== name || !$('compose-text')) return;
  const hasEnv = !!$('env-text');
  openDialog(`Load files into ${name}`,
    `<p class="muted small">Their text replaces <code>${esc(FILES.compose)}</code>${hasEnv ? ` and <code>${esc(FILES.env)}</code>` : ''} in the editors, whatever the files are called; the next step shows the difference to the stack's folder.</p>
     <label class="field"><span>Compose file (<code>.yaml</code>, <code>.yml</code>)</span><input type="file" id="lf-compose" accept=".yaml,.yml"></label>
     <label class="field"><span>Env file (<code>.env</code>)</span><input type="file" id="lf-env" accept=".env" ${hasEnv ? '' : 'disabled'}></label>
     ${hasEnv ? '' : '<p class="muted small">This stack has no env file.</p>'}<div id="dlg-err"></div>`,
    '<button data-close>Cancel</button><button class="primary" id="lf-go">Compare</button>');
  $('lf-go').addEventListener('click', async () => {
    const c = $('lf-compose').files[0];
    const e = hasEnv ? $('lf-env').files[0] : null;
    const bad = [];
    if (c && !(/\.ya?ml$/i.test(c.name) && c.size < 512 * 1024)) bad.push(`${c.name}: not a compose file (.yaml, under 512 KiB)`);
    if (e && !(/\.env$/i.test(e.name) && e.size < 512 * 1024)) bad.push(`${e.name}: not an env file (.env, under 512 KiB)`);
    if (!c && !e) bad.push(hasEnv ? 'Choose a compose file, an env file or both.' : 'Choose a compose file.');
    if (bad.length) { $('dlg-err').innerHTML = errBox(bad.join(' · ')); return; }
    if (c) $('compose-text').value = await c.text();
    if (e) $('env-text').value = await e.text();
    $('compose-text').dispatchEvent(new Event('input'));
    closeDialog();
    saveFlow(name, live(name));
  });
}

async function updateAfterSave(name) {
  let p;
  try { p = await api(`/api/stacks/${enc(name)}/plan`); }
  catch (e) { return openDialog(`Update ${name}`, errBox(e.message)); }
  // a new stack, a container in the way or a missing secret: the usual dialog, which asks or explains
  if (p.action !== 'update' || p.blocking.length || p.missingSecrets?.length) return startDeploy(name);
  openDialog(`Updating ${name}`, `<p class="muted">Deploying the saved files with podman-compose…</p>`, '<button disabled>Working…</button>');
  try {
    const r = await api(`/api/stacks/${enc(name)}/deploy`, { method: 'POST', body: JSON.stringify({ pull: false, remove: [] }) });
    if (r.ok) { closeDialog(); toast(`Updated ${name}`); }
    else openDialog(`Update ${name} failed`, `${errBox('The update did not finish.')}<pre>${esc(r.log.join('\n') || '(no output)')}</pre>`);
  } catch (e) {
    openDialog(`Update ${name} failed`, errBox(e.message));
  }
  load();
}

async function tabHistory(name, note = '') {
  $('tab').innerHTML = '<p class="muted pad">Loading…</p>';
  let h;
  try { h = await api(`/api/stacks/${enc(name)}/history`); }
  catch (e) { if (onTab(name, 'history')) $('tab').innerHTML = errBox(e.message); return; }
  if (!onTab(name, 'history')) return;
  const versions = HIST_FILE ? h.versions.filter((v) => v.file === HIST_FILE) : h.versions;
  const head = (note ? `<div class="ok-note">${esc(note)}</div>` : '')
    + (HIST_FILE ? `<p class="muted small">Only <b>${esc(HIST_FILE)}</b> · <a href="#" id="hist-all">show all files</a></p>` : '');
  if (!versions.length) {
    $('tab').innerHTML = `${head}<section class="panel"><p class="muted">No saved version yet. Every save on the Files tab keeps the previous file here.</p></section>`;
    $('hist-all')?.addEventListener('click', (e) => { e.preventDefault(); HIST_FILE = ''; tabHistory(name); });
    return;
  }
  $('tab').innerHTML = `${head}<div class="hist">
      <div class="hist-list" aria-label="Saved versions">${versions.map((v) =>
        `<button data-version="${esc(v.version)}">${esc(new Date(v.time).toLocaleString())}<span class="file">${esc(v.file)}</span></button>`).join('')}</div>
      <section class="panel" id="hist-view"><p class="muted">Choose a version to see what restoring it would bring back.</p></section>
    </div>`;
  const view = async (btn) => {
    document.querySelectorAll('.hist-list button').forEach((b) => b.classList.toggle('sel', b === btn));
    const version = btn.dataset.version;
    $('hist-view').innerHTML = '<p class="muted">Loading…</p>';
    let d;
    try { d = await api(`/api/stacks/${enc(name)}/history?version=${enc(version)}`); }
    catch (e) { $('hist-view').innerHTML = errBox(e.message); return; }
    $('hist-view').innerHTML = `<div id="hist-err"></div>
      <p class="muted small"><b>${esc(d.file)}</b> as it was before the save of ${esc(new Date(d.time).toLocaleString())}.
        − is the file now, + is what restoring brings back.</p>
      ${diffHtml(d.diff)}
      <div class="head-actions" style="margin-top:12px;justify-content:flex-end">
        <button class="primary" id="hist-restore" ${d.diff ? '' : 'disabled title="Same as the file now"'}>${live(name) ? 'Restore and update' : 'Restore this version'}</button></div>`;
    $('hist-restore').addEventListener('click', async () => {
      $('hist-restore').disabled = true;
      const andUpdate = live(name);
      try {
        const r = await api(`/api/stacks/${enc(name)}/restore`, { method: 'POST', body: JSON.stringify({ version }) });
        toast(`Restored ${r.restored}`);
        tabHistory(name, `Restored ${r.restored}; the file it replaced is in the history too.${andUpdate ? '' : ' The stack gets it when it is created.'}`);
        if (andUpdate) updateAfterSave(name); else load();
      } catch (e) { $('hist-err').innerHTML = errBox(e.message); $('hist-restore').disabled = false; }
    });
  };
  document.querySelectorAll('.hist-list button').forEach((b) => b.addEventListener('click', () => view(b)));
  $('hist-all')?.addEventListener('click', (e) => { e.preventDefault(); HIST_FILE = ''; tabHistory(name); });
}

async function tabDiff(name) {
  const s = stackOf(name);
  if (!s.stack) {
    $('tab').innerHTML = '<section class="panel"><p class="muted">The stack is not deployed yet, so there is nothing to compare. <i>Create</i> it first.</p></section>';
    return;
  }
  $('tab').innerHTML = '<p class="muted pad">Loading…</p>';
  let d;
  try { d = await api(`/api/stacks/${enc(name)}/diff`); }
  catch (e) { if (onTab(name, 'diff')) $('tab').innerHTML = errBox(e.message); return; }
  if (!onTab(name, 'diff')) return;
  if (!d.exists) {
    $('tab').innerHTML = '<section class="panel"><p class="muted">There is no record of what was deployed: the stack was started before stack-ui kept one. The next <i>Update</i> records it.</p></section>';
    return;
  }
  const was = 'was deployed last';
  $('tab').innerHTML = `<section class="panel">
      <p class="muted">− is what ${was}; + is what an update sends from the ${esc(SOURCE)}.</p>
      <h4>Compose file</h4>${diffHtml(d.compose)}<h4>Variables</h4>${diffHtml(d.env)}${
      Object.entries(d.files || {}).filter(([, x]) => x).map(([n, x]) => `<h4>${esc(n)}</h4>${diffHtml(x)}`).join('')}</section>`;
}

async function startDeploy(name) {
  openDialog(`Update ${name}`, '<p class="muted">Checking…</p>');
  let p;
  try { p = await api(`/api/stacks/${enc(name)}/plan`); }
  catch (e) { return openDialog(`Update ${name}`, errBox(e.message)); }
  const create = p.action !== 'update';
  const title = `${create ? 'Create' : 'Update'} ${name}`;
  if (p.missingSecrets?.length) {
    return openDialog(title, `${errBox(`These Podman secrets do not exist yet: ${p.missingSecrets.join(', ')}.`)}
      <p>Create them under <a href="#/secrets">Secrets</a>, then try again.</p>`);
  }
  const where = 'with podman-compose';
  let body = create
    ? `<p>Creates <b>${esc(name)}</b> ${where} from the compose file and variables stored here.
         The host directories must exist: create them before the first deploy.</p>`
    : `<p>Updates <b>${esc(name)}</b> ${where} with the compose file and variables stored here.</p>
       <label class="check"><input type="checkbox" id="pull" checked> <span>Pull the newest images first</span></label>`;
  if (p.blocking.length) {
    body += `<p><b>In the way</b> (containers of the same name that are not part of this stack):</p><ul class="plain">${
      p.blocking.map((c) => `<li>${esc(c.name)}, ${esc(c.state)} · <span class="muted">${esc(c.image)}</span></li>`).join('')}</ul>
      <label class="check"><input type="checkbox" id="remove"> <span>Stop and remove ${p.blocking.length > 1 ? 'these containers' : 'this container'};
      its data on the host stays</span></label>`;
  }
  openDialog(title, body, `<button data-close>Cancel</button><button class="primary" id="go">${create ? 'Create' : 'Update'}</button>`);
  const goBtn = $('go');
  const remove = $('remove');
  if (remove) { goBtn.disabled = true; remove.addEventListener('change', () => { goBtn.disabled = !remove.checked; }); }
  goBtn.addEventListener('click', async () => {
    goBtn.disabled = true;
    goBtn.textContent = create ? 'Creating…' : 'Updating…';
    const payload = { pull: $('pull') ? $('pull').checked : true, remove: remove && remove.checked ? p.blocking.map((c) => c.name) : [] };
    try {
      const r = await api(`/api/stacks/${enc(name)}/deploy`, { method: 'POST', body: JSON.stringify(payload) });
      if (r.ok) { closeDialog(); toast(`${create ? 'Created' : 'Updated'} ${name}`); }
      else openDialog(`${title} failed`, `${errBox('It did not finish.')}<pre>${esc(r.log.join('\n') || '(no output)')}</pre>`);
    } catch (e) {
      openDialog(`${title} failed`, errBox(e.message));
    }
    load();
  });
}

function updateSelected(names) {
  const list = names.filter((n) => stackOf(n)?.stack);
  if (!list.length) return;
  openDialog(`Update ${plural(list.length, 'stack')}`,
    `<p>Pulls the newest images and updates these stacks one after the other. Like <i>Update</i>, it sends the files
        stored here.</p>
     <ul class="plain">${list.map((n) => `<li>${esc(n)} ${imageCell(n).replace('data-act="deploy"', 'disabled')}</li>`).join('')}</ul>
     <pre id="upd-log" hidden></pre>`,
    `<button data-close>Cancel</button><button class="primary" id="upd-go">Update ${plural(list.length, 'stack')}</button>`);
  $('upd-go').addEventListener('click', async () => {
    $('upd-go').disabled = true; $('upd-go').textContent = 'Updating…';
    const out = $('upd-log');
    out.hidden = false;
    const add = (line) => { out.textContent += `${line}\n`; out.scrollTop = out.scrollHeight; };
    let ok = 0;
    for (const name of list) {
      add(`${name}: updating…`);
      try {
        const r = await api(`/api/stacks/${enc(name)}/deploy`, {
          method: 'POST', body: JSON.stringify({ pull: true, onlyUpdate: true, remove: [] }) });
        add(`${name}: ${r.ok ? 'updated' : 'failed'}`);
        r.log.forEach((l) => add(`  ${l}`));
        if (r.ok) ok++;
      } catch (e) { add(`${name}: failed\n  ${e.message}`); }
    }
    add(`Done: ${ok} of ${list.length} updated.`);
    SELECTED.clear();
    await load();
    let foot = '<button data-close>Close</button>';
    try {
      const im = await api('/api/images');
      if (im.reclaimable) foot = `<button data-close>Close</button><button id="upd-clean">${icon('trash')}<span>Clean up old images (${fmtBytes(im.reclaimable)})</span></button>`;
    } catch { /* the cleanup offer is optional */ }
    $('dlg-foot').innerHTML = foot;
    $('upd-clean')?.addEventListener('click', showCleanup);
    toast(`Updated ${ok} of ${plural(list.length, 'stack')}`, ok === list.length ? 'ok' : 'bad');
  });
}

function showAdd() {
  openDialog('Add stack',
    `<div id="dlg-err"></div>
     <p>Upload a stack as a new folder of STACKS_DIR. A locally built image must already be on this host.</p>
     <label class="field"><span>Compose file (<code>.yaml</code>, <code>.yml</code>)</span><input type="file" id="add-compose" accept=".yaml,.yml"></label>
     <label class="field"><span>Env file (<code>.env</code>, optional)</span><input type="file" id="add-env" accept=".env"></label>
     <label class="field"><span>Other files (optional: the scripts, JSON/YAML configs and README it uses)</span><input type="file" id="add-other" multiple accept=".yaml,.yml,.sh,.md,.txt,.json"></label>
     <label class="field"><span>Stack name (also the podman-compose project name)</span><input type="text" id="add-name" placeholder="e.g. my-app" autocomplete="off"></label>
     <div id="add-pick"></div>`,
    '<button data-close>Cancel</button><button class="primary" id="add-go" disabled>Add stack</button>');
  let pkg = {}; let compose = ''; let env = null;
  const usable = (file) => /\.(ya?ml|env|sh|md|txt|json)$/i.test(file.name) && file.size < 512 * 1024;
  async function collect() {
    pkg = {}; compose = ''; env = null;
    const notes = [];
    const c = $('add-compose').files[0];
    const e = $('add-env').files[0];
    if (c && /\.ya?ml$/i.test(c.name) && usable(c)) { compose = c.name; pkg[c.name] = await c.text(); } else if (c) notes.push(`${esc(c.name)}: not a compose file (.yaml, under 512 KiB)`);
    if (e && /\.env$/i.test(e.name) && usable(e) && !(e.name in pkg)) { env = e.name; pkg[e.name] = await e.text(); } else if (e) notes.push(`${esc(e.name)}: not usable as the env file`);
    for (const f of $('add-other').files) {
      if (f.name in pkg) notes.push(`${esc(f.name)}: chosen twice, skipped`);
      else if (/\.env$/i.test(f.name)) notes.push(`${esc(f.name)}: skipped (an env file goes into Env file)`);
      else if (usable(f)) pkg[f.name] = await f.text();
      else notes.push(`${esc(f.name)}: skipped (only .yaml .yml .env .sh .md .txt .json, under 512 KiB)`);
    }
    if (compose && !$('add-name').value) {
      const base = compose.replace(/(\.compose)?\.ya?ml$/i, '').replace(/^\d+-/, '').toLowerCase();
      if (/^[a-z0-9][a-z0-9_-]*$/.test(base)) $('add-name').value = base;
    }
    $('add-pick').innerHTML = `<p class="muted small">${Object.keys(pkg).map(esc).join(', ') || 'No file chosen yet'}</p>`
      + (notes.length ? `<p class="small">${notes.join('<br>')}</p>` : '');
    $('add-go').disabled = !compose;
  }
  ['add-compose', 'add-env', 'add-other'].forEach((id) => $(id).addEventListener('change', collect));
  $('add-go').addEventListener('click', async () => {
    $('add-go').disabled = true;
    const body = { name: $('add-name').value.trim(), files: pkg, compose, env };
    try {
      const r = await api('/api/stacks', { method: 'POST', body: JSON.stringify(body) });
      closeDialog();
      await load();
      toast(`Added ${r.name}. Check its files, create its host directories if it needs any, then create it.`);
      go(`#/stacks/${enc(r.name)}/files`);
    } catch (e) {
      $('dlg-err').innerHTML = errBox(e.message); $('add-go').disabled = false;
    }
  });
}

// ---------- containers ----------
let CFILTER = 'all'; let CQUERY = '';
const CFILTERS = [['all', 'All', () => true], ['running', 'Running', (c) => c.state === 'running'],
  ['stopped', 'Stopped', (c) => c.state !== 'running'], ['outside', 'Outside stacks', (c) => !c.inStack]];
function portLinks(c) {
  return c.ports.map((p) => (p.protocol === 'tcp'
    ? `<a href="http://${esc(p.host && p.host !== '0.0.0.0' ? p.host : location.hostname)}:${p.port}/" target="_blank" rel="noopener">${p.port}</a>`
    : `<span class="muted">${p.port}/${esc(p.protocol)}</span>`)).join('') || '<span class="muted small">—</span>';
}
async function viewContainers() {
  $('view').innerHTML = `
    <div class="page-head">
      <div><h1>Containers</h1><p class="sub">Every container on this host. A container of a stack is removed with its stack; this page itself is protected.</p></div>
      <div class="head-actions">
        <label class="search">${icon('search')}<input id="cq" type="search" placeholder="Search containers and images" value="${esc(CQUERY)}" autocomplete="off" aria-label="Search"></label>
        <button class="icon-btn" id="c-reload" title="Reload" aria-label="Reload">${icon('refresh')}</button>
      </div>
    </div>
    <div class="chips" id="c-chips" role="toolbar" aria-label="Show"></div>
    <div id="c-body"><p class="muted pad">Loading…</p></div>`;
  let list = [];
  const draw = () => {
    const f = (CFILTERS.find((x) => x[0] === CFILTER) || CFILTERS[0])[2];
    const q = CQUERY.trim().toLowerCase();
    const rows = list.filter((c) => f(c) && (!q || c.name.toLowerCase().includes(q) || String(c.image).toLowerCase().includes(q)));
    $('c-chips').innerHTML = CFILTERS.map(([k, label, fn]) => `<button class="chip${CFILTER === k ? ' on' : ''}" data-cf="${k}" aria-pressed="${CFILTER === k}">${label} <b>${list.filter(fn).length}</b></button>`).join('');
    $('c-body').innerHTML = `<div class="table ctab"><div class="tr th"><span>Name</span><span>Image</span><span>State</span><span>Ports</span><span class="r">Actions</span></div>${
      rows.map((c) => {
        const n = esc(c.name);
        const run = c.state === 'running';
        const btn = (act, label, ok = true, cls = 'small') => `<button class="${cls}" data-ca="${act}" data-c="${n}" ${ok ? '' : 'disabled'}>${label}</button>`;
        const stackTag = !c.stack ? '' : c.inStack ? ` <a class="tag t-idle bk" href="#/stacks/${enc(c.stack)}/summary">${esc(c.stack)}</a>` : ` <span class="tag t-idle bk">${esc(c.stack)}</span>`;
        return `<div class="tr">
          <span class="c-name"><b>${n}</b>${stackTag}${c.protected ? ' <span class="tag t-idle bk">Protected</span>' : ''}<span class="files">${esc(ago(c.created))}</span></span>
          <span class="files">${esc(c.image)}</span>
          <span class="ct"><i class="dot ${dotClass(c.state)}"></i>${esc(c.state)}${healthTag(c.status)}</span>
          <span class="ports small">${portLinks(c)}</span>
          <span class="r">${run ? btn('stop', 'Stop', !c.protected) : btn('start', 'Start')}${btn('restart', 'Restart', run && !c.protected)}${btn('logs', 'Logs')}${btn('details', 'Details')}${btn('remove', 'Remove', !c.inStack && !c.protected, 'small danger')}</span></div>`;
      }).join('') || '<div class="empty">No container matches.</div>'}</div>`;
  };
  const reload = async () => {
    try { list = (await api('/api/containers')).containers; }
    catch (e) { if (ROUTE.view === 'containers') $('c-body').innerHTML = errBox(e.message); return; }
    if (ROUTE.view === 'containers') draw();
  };
  $('cq').addEventListener('input', (e) => { CQUERY = e.target.value; draw(); });
  $('c-reload').addEventListener('click', reload);
  $('c-chips').addEventListener('click', (e) => { const b = e.target.closest('[data-cf]'); if (b) { CFILTER = b.dataset.cf; draw(); } });
  $('c-body').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-ca]');
    if (!b) return;
    const name = b.dataset.c;
    const act = b.dataset.ca;
    if (act === 'logs') { go(`#/logs/${enc(name)}`); return; }
    if (act === 'details') {
      openDialog(`Details: ${name}`, '<p class="muted">Loading…</p>');
      try {
        const info = await api(`/api/containers/${enc(name)}/inspect`);
        openDialog(`Details: ${name}`, `<p class="muted small">Secret-looking variables are shown as ••••.</p><pre class="json">${esc(JSON.stringify(info, null, 2))}</pre>`);
      } catch (err) { openDialog(`Details: ${name}`, errBox(err.message)); }
      return;
    }
    const run = async () => {
      try {
        await api('/api/containers/action', { method: 'POST', body: JSON.stringify({ name, action: act }) });
        closeDialog();
        toast(`${act[0].toUpperCase()}${act.slice(1)}: ${name}`);
      } catch (err) { if ($('dlg').open && $('dlg-err')) $('dlg-err').innerHTML = errBox(err.message); else toast(err.message, 'bad'); }
      reload();
    };
    if (act === 'remove' || act === 'stop') {
      openDialog(`${act === 'remove' ? 'Remove' : 'Stop'} ${name}`, `<div id="dlg-err"></div><p>${act === 'remove'
        ? `Removes the container <b>${esc(name)}</b> (also when it runs). It is not part of a stack.`
        : `Stops the container <b>${esc(name)}</b> (waiting up to 30 seconds).`}</p>`,
      `<button data-close>Cancel</button><button class="${act === 'remove' ? 'danger' : 'primary'}" id="c-go">${act === 'remove' ? 'Remove' : 'Stop'}</button>`);
      $('c-go').addEventListener('click', () => { $('c-go').disabled = true; run(); });
      return;
    }
    b.disabled = true;
    run();
  });
  reload();
}

let LOG_TIMER = null;
async function viewLogs() {
  clearInterval(LOG_TIMER);
  const current = ROUTE.container;
  $('view').innerHTML = `
    <div class="page-head">
      <div><h1>Logs</h1><p class="sub">The last lines a container wrote (stdout and stderr), with their time.</p></div>
      <div class="head-actions">
        <select id="lg-c" aria-label="Container"><option>Loading…</option></select>
        <select id="lg-n" aria-label="Lines">${[200, 500, 2000].map((n) => `<option value="${n}">${n} lines</option>`).join('')}</select>
        <label class="search">${icon('search')}<input id="lg-q" type="search" placeholder="Filter lines" autocomplete="off" aria-label="Filter lines"></label>

      </div>
    </div>
    <div id="lg-body"><p class="muted pad">Loading…</p></div>`;
  let lines = [];
  const show = () => {
    const q = $('lg-q').value.toLowerCase();
    const shown = q ? lines.filter((l) => l.toLowerCase().includes(q)) : lines;
    $('lg-body').innerHTML = shown.length ? `<pre class="logs">${esc(shown.join('\n'))}</pre>` : '<div class="empty">No line.</div>';
    const pre = $('lg-body').querySelector('pre');
    if (pre) pre.scrollTop = pre.scrollHeight;
  };
  const fetchLogs = async () => {
    if (ROUTE.view !== 'logs' || !$('lg-c').value) return;
    try { lines = (await api(`/api/containers/${enc($('lg-c').value)}/logs?tail=${$('lg-n').value}`)).lines; show(); }
    catch (e) { $('lg-body').innerHTML = errBox(e.message); }
  };
  let list;
  try { list = (await api('/api/containers')).containers; }
  catch (e) { if (ROUTE.view === 'logs') $('lg-body').innerHTML = errBox(e.message); return; }
  if (ROUTE.view !== 'logs') return;
  if (!list.length) { $('lg-c').innerHTML = ''; $('lg-body').innerHTML = '<div class="empty">No container.</div>'; return; }
  $('lg-c').innerHTML = list.map((c) => `<option value="${esc(c.name)}" ${c.name === current ? 'selected' : ''}>${
    esc(c.stack ? `${c.stack} / ${c.name}` : c.name)}${c.state !== 'running' ? ` (${esc(c.state)})` : ''}</option>`).join('');
  $('lg-c').addEventListener('change', () => { history.replaceState(null, '', `#/logs/${enc($('lg-c').value)}`); fetchLogs(); });
  $('lg-n').addEventListener('change', fetchLogs);
  $('lg-q').addEventListener('input', show);
  $('lg-r').addEventListener('click', fetchLogs);
  $('lg-auto').addEventListener('change', () => {
    clearInterval(LOG_TIMER);
    if ($('lg-auto').checked) LOG_TIMER = setInterval(() => (ROUTE.view === 'logs' ? fetchLogs() : clearInterval(LOG_TIMER)), 5000);
  });
  fetchLogs();
}
